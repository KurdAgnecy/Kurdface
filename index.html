<!DOCTYPE html>
<html lang="ku" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kurd Face Studio - Powered by Kurd Agency</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.8/vision_bundle.js" crossorigin="anonymous"></script>

    <link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@300;400;600;700&family=Cairo:wght@400;600;700&family=Tajawal:wght@400;500;700&family=Changa:wght@400;600;700&family=Lalezar&family=Reem+Kufi:wght@500;700&family=Almarai:wght@400;700&family=Roboto:wght@400;500;700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Noto Kufi Arabic', sans-serif; transition: background-color 0.3s, color 0.3s; user-select: none; overflow: hidden; height: 100vh; }
        .dark body { background-color: #08090c; color: #f3f4f6; }
        .light body { background-color: #f8fafc; color: #0f172a; }
        
        .workspace-grid { background-image: radial-gradient(#1e293b 1px, transparent 1px); background-size: 20px 20px; }
        .light .workspace-grid { background-image: radial-gradient(#cbd5e1 1px, transparent 1px); }

        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; height: 18px; width: 18px; border-radius: 50%; background: #f59e0b; cursor: pointer; margin-top: -7px; box-shadow: 0 0 10px rgba(245, 158, 11, 0.8);
        }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; background: #1e293b; border-radius: 2px; }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        #faceMeshWrapper { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
        .effect-overlay-layer { position: absolute; inset: 0; pointer-events: none; opacity: 0; z-index: 25; transition: all 0.3s ease; }
        
        /* چوارچێوەی لۆکاڵی بۆ Mockups */
        .mockup-phone { border: 12px solid #1e293b; border-radius: 36px; padding: 4px; background: #000; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); }

        #beforeAfterContainer { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; display: none; z-index: 45; }
        #beforeImage { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; z-index: 1; clip-path: inset(0 50% 0 0); }
        #sliderHandle { position: absolute; top: 0; bottom: 0; left: 50%; width: 4px; background: #f59e0b; cursor: ew-resize; z-index: 2; pointer-events: auto; transform: translateX(-50%); }

        .safe-zone { position: absolute; inset: 0; border: 3px dashed #ef4444; pointer-events: none; display: none; z-index: 48; opacity: 0.7; }
    </style>
</head>
<body class="flex flex-col">

    <div id="globalProgressBar" class="fixed top-0 left-0 right-0 h-1.5 bg-amber-500/10 z-[100] hidden">
        <div id="progressFillInner" class="h-full bg-gradient-to-r from-amber-500 to-yellow-400 w-0 transition-all duration-100 ease-out"></div>
    </div>
    
    <div id="progressPercentageModal" class="fixed inset-0 bg-black/80 z-[90] hidden flex flex-col items-center justify-center">
        <div class="bg-[#11131e] border border-slate-800 p-8 rounded-2xl text-center max-w-xs w-full shadow-2xl">
            <div class="w-16 h-16 rounded-full border-4 border-amber-500/20 border-t-amber-500 animate-spin mx-auto mb-4"></div>
            <h3 class="text-sm font-bold text-white mb-1" id="modalProgressTitle">پڕۆسەی زیرەکی دەستکرد</h3>
            <p id="progressStatusText" class="text-[11px] text-slate-400 mb-4">پڕۆسێس دەکرێت...</p>
            <div class="text-3xl font-black text-amber-500 font-mono" id="numericPercentageDisplay">0%</div>
        </div>
    </div>

    <header class="bg-[#0f111a] border-b border-slate-800 px-6 py-4 flex justify-between items-center shrink-0 z-50 shadow-lg">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-amber-500 to-yellow-400 flex items-center justify-center font-bold text-black text-xl shadow-lg">KF</div>
            <div>
                <h1 class="text-md font-bold tracking-wide" id="mainAppTitle">Kurd Face Studio</h1>
                <p class="text-[10px] text-amber-500 font-medium" id="mainAppSubtitle">دروستکراوە لە لایەن ئاریان علی : کورد ئەجێنسی</p>
            </div>
        </div>
        
        <div class="flex items-center gap-3 flex-wrap">
            <select id="langSelect" onchange="changeAppLanguage(this.value)" class="bg-slate-900 border border-slate-800 text-xs px-2.5 py-1.5 rounded-lg text-white outline-none">

                <option value="ar">العربية</option>
                <option value="en">English</option>

                <button onclick="switchStudioCategory('body', this)" class="cat-btn text-slate-400 hover:text-white px-4 py-2.5 rounded-xl text-xs font-semibold transition shrink-0" id="catBody">💪 جەستە</button>
                <button onclick="switchStudioCategory('filters', this)" class="cat-btn text-slate-400 hover:text-white px-4 py-2.5 rounded-xl text-xs font-semibold transition shrink-0" id="catFilters">🎬 فلتەرەکان</button>
                <button onclick="switchStudioCategory('effects', this)" class="cat-btn text-slate-400 hover:text-white px-4 py-2.5 rounded-xl text-xs font-semibold transition shrink-0" id="catEffects">✨ ئیفێکتەکان</button>
                <button onclick="switchStudioCategory('text', this)" class="cat-btn text-slate-400 hover:text-white px-4 py-2.5 rounded-xl text-xs font-semibold transition shrink-0" id="catText">📝 تێکست و قالب</button>

                <button onclick="switchStudioCategory('export', this)" class="cat-btn text-emerald-400 hover:bg-emerald-500/10 px-4 py-2.5 rounded-xl text-xs font-bold transition shrink-0" id="catExport">💾 سەیڤکردن</button>

            <div id="controlsConsoleArea" class="flex-1 overflow-y-auto p-4 space-y-4 no-scrollbar bg-[#0c0d14]"></div>
            
            <div class="p-3 bg-[#090a0f] text-center border-t border-slate-800/80 text-[11px] text-slate-500">
                Kurd Face Studio v2.5 — <span class="text-amber-500 font-semibold">ئاریان علی : کورد ئەجێنسی</span>
            </div>

                upload: "بارکردنی وێنە 📁", female: "کچ 👩‍🦰", male: "کوڕ 👨‍🦱"
            },

                face: "👤 الوجه", makeup: "💄 الماكياج", body: "💪 الجسم", filters: "🎬 الفلاتر", effects: "✨ التأثيرات", text: "📝 النصوص", ai: "🤖 الذكاء الاصطناعي", export: "💾 الحفظ والتصدير",
                upload: "تحميل صورة 📁", female: "أنثى 👩‍🦰", male: "ذكر 👨‍🦱"
            },

                face: "👤 Face Profile", makeup: "💄 Makeup Engine", body: "💪 Body Sculpt", filters: "🎬 Filters", effects: "✨ FX Overlays", text: "📝 Typography", ai: "🤖 AI Core", export: "💾 Save & Export",
                upload: "Upload Photo 📁", female: "Female Sample 👩‍🦰", male: "Male Sample 👨‍🦱"
            }
        };

        const appEngineState = {

            activeCategory: 'face',
            activeSubTab: 'shape',

            textContent: 'کورد فەیس',

            exportFormat: 'image/png',

            cropperInstance: null,
            
            sliders: {

                    width: { label: 'پانی دەموچاو (Width)', val: 0, min: -20, max: 20, unit: '%' },
                    vshape: { label: 'شێوەی ڤی (V-Shape)', val: 0, min: 0, max: 20, unit: '%' }
                },
                eyebrows: {

                    lift: { label: 'بەرزکردنەوەی برۆ (Lift)', val: 0, min: -15, max: 15, unit: 'px' }
                },
                eyes: { size: { label: 'قەبارەی چاوەکان (Size)', val: 100, min: 80, max: 125, unit: '%' } },
                nose: { size: { label: 'قەبارەی لوت (Size)', val: 100, min: 80, max: 120, unit: '%' } },
                mouth: { smile: { label: 'پێکەنین (Smile)', val: 0, min: -10, max: 20, unit: 'px' } },
                lipstick: { intensity: { label: 'خەستی سووراو', val: 0, min: 0, max: 100, unit: '%' } },
                blush: { intensity: { label: 'خەستی ڕوومەتگەشێن', val: 0, min: 0, max: 100, unit: '%' } },
                bodyManual: { scaleX: { label: 'پانی دەستی (Manual)', val: 100, min: 80, max: 120, unit: '%' } },
                bodyAuto: { slimming: { label: 'باریککردنی زیرەک (AI Slim)', val: 0, min: 0, max: 35, unit: '%' } },
                bodyMuscle: { definition: { label: 'دیاریکردنی هێڵی ماسولکەکان', val: 0, min: 0, max: 100, unit: '%' } },
                bodyAppearance: { smoothness: { label: 'لووسکردنی پێستی جەستە', val: 0, min: 0, max: 100, unit: '%' } },
                bodyTattoo: { alpha: { label: 'تۆخی تاتۆی جەستە', val: 0, min: 0, max: 100, unit: '%' } }
            }
        };

        let historyStack = [];
        let historyIndex = -1;
        let faceLandmarker;
        let isMediaPipeReady = false;

        const hierarchyConfig = {
            face: [
                { id: 'shape', label: 'شێوە (Shape)', icon: '📐' },
                { id: 'eyebrows', label: 'برۆکان', icon: '〰️' },
                { id: 'eyes', label: 'چاوەکان', icon: '👁️' },
                { id: 'nose', label: 'لوت', icon: '👃' },
                { id: 'mouth', label: 'دەم', icon: '👄' }
            ],
            makeup: [
                { id: 'lipstick', label: 'سووراو (Lipstick)', icon: '💄' },
                { id: 'blush', label: 'ڕوومەتگەشێن (Blush)', icon: '🌸' }
            ],
            body: [
                { id: 'bodyManual', label: 'ڕێکخستن', icon: '✋' },
                { id: 'bodyAuto', label: 'باریککردن', icon: '✨' },
                { id: 'bodyMuscle', label: 'ماسولکە AI', icon: '💪' },
                { id: 'bodyAppearance', label: 'لووسکردن', icon: '🧼' },
                { id: 'bodyTattoo', label: 'تاتۆ', icon: '⚓' }
            ],
            filters: null,
            effects: [
                { id: 'sunlightSub', label: 'تۆڕی Sunlight', icon: '☀️' },
                { id: 'butterflySub', label: 'گرووپی Butterfly', icon: '🦋' }
            ],
            text: [
                { id: 'textAdd', label: 'نووسین و قالب', icon: '➕' },
                { id: 'textStyle', label: 'فۆنت و ڕەنگ', icon: '🎨' }
            ],
            ai: [
                { id: 'aiTools', label: 'ئامرازی زیرەک', icon: '🤖' },
                { id: 'cropLayout', label: 'بڕین و مۆکئەپ', icon: '✂️' }
            ],
            export: null
        };

        const extensiveFiltersList = [
            { id: 'none', label: 'ئاسایی (Normal)' },
            { id: 'basis', label: 'Basis Beauty 🌸', matrix: 'contrast(1.15) brightness(1.03) saturate(1.12)' },
            { id: 'clear', label: 'Clear Face ✨', matrix: 'brightness(1.10) contrast(1.04) saturate(0.92)' },
            { id: 'cream', label: 'Cream Soft 🍦', matrix: 'sepia(0.18) brightness(1.06) saturate(1.05) contrast(0.96)' },
            { id: 'cold', label: 'Cold Luxury ❄️', matrix: 'hue-rotate(12deg) saturate(0.88) contrast(1.04)' },
            { id: 'mono', label: 'Noir Black & White 🖤', matrix: 'grayscale(1) contrast(1.2) brightness(0.95)' }
        ];

        document.addEventListener('DOMContentLoaded', () => {
            renderSubTabsSystem();
            renderControlConsole();
            initializeEraserSystem();
            initializeBeforeAfterSlider();
            initializeMediaPipeFaceMesh();
            saveStateToHistory();
        });

        async function initializeMediaPipeFaceMesh() {
            try {
                const visionInstance = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.8/wasm");
                faceLandmarker = await FaceLandmarker.createFromOptions(visionInstance, {
                    baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task" },
                    runningMode: "IMAGE",
                    outputFaceBlendshapes: true
                });
                isMediaPipeReady = true;
                triggerFaceLandmarkProcessing();
            } catch (err) {
                console.warn("MediaPipe Core fallback active.");
            }
        }

        async function triggerFaceLandmarkProcessing() {
            const img = document.getElementById('targetImage');
            if (!isMediaPipeReady || !faceLandmarker || !img.complete) return;

            const canvas = document.getElementById('makeupCanvas');
            const ctx = canvas.getContext('2d');
            canvas.width = img.clientWidth;
            canvas.height = img.clientHeight;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const result = await faceLandmarker.detect(img);
            if (result && result.faceLandmarks && result.faceLandmarks.length > 0) {
                const landmarks = result.faceLandmarks[0];
                const lipIndices = [61, 146, 91, 181, 84, 172, 91, 95, 88, 178, 87, 14, 317, 402, 318, 324, 308, 415, 310, 311, 312, 13, 82, 81, 80, 191];
                const intensity = appEngineState.sliders.lipstick.intensity.val / 100;
                
                if (intensity > 0) {
                    ctx.beginPath();
                    lipIndices.forEach((idx, i) => {
                        const pt = landmarks[idx];
                        if (i === 0) ctx.moveTo(pt.x * canvas.width, pt.y * canvas.height);
                        else ctx.lineTo(pt.x * canvas.width, pt.y * canvas.height);
                    });
                    ctx.closePath();
                    ctx.fillStyle = hexToRgbA(appEngineState.currentHexColor, intensity * 0.7);
                    ctx.fill();
                }
            }
        }

        function hexToRgbA(hex, alpha) {
            let c;
            if(/^#([A-Fa-f0-9]{3}){1,2}$/.test(hex)){
                c= hex.substring(1).split('');
                if(c.length== 3){ c= [c[0], c[0], c[1], c[1], c[2], c[2]]; }
                c= '0x'+c.join('');
                return 'rgba('+[(c>>16)&255, (c>>8)&255, c&255].join(',')+','+alpha+')';
            }
            return 'rgba(220,38,38,0.5)';
        }

        function changeAppLanguage(lang) {
            appEngineState.currentLanguage = lang;
            const dict = localizationEngine[lang];
            document.getElementById('mainAppTitle').innerText = dict.mainTitle;
            document.getElementById('mainAppSubtitle').innerText = dict.subtitle;
            document.documentElement.dir = (lang === 'en') ? 'ltr' : 'rtl';
            renderSubTabsSystem();
            renderControlConsole();
        }

        function toggleLightDarkModeSystem() {
            document.documentElement.classList.toggle('dark');
            document.documentElement.classList.toggle('light');
        }

        function switchStudioCategory(cat, element) {
            appEngineState.activeCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(b => {
                b.className = "cat-btn text-slate-400 hover:text-white px-4 py-2.5 rounded-xl text-xs font-semibold transition shrink-0";
            });
            element.className = "cat-btn bg-amber-500 text-black px-4 py-2.5 rounded-xl text-xs font-bold transition shrink-0";
            appEngineState.activeSubTab = hierarchyConfig[cat] ? hierarchyConfig[cat][0].id : null;
            renderSubTabsSystem();
            renderControlConsole();
        }

        function switchSubTabContext(subId, element) {
            appEngineState.activeSubTab = subId;
            document.querySelectorAll('.sub-tab-node').forEach(b => {
                b.className = "sub-tab-node shrink-0 text-xs px-3.5 py-2 rounded-xl text-slate-400 bg-slate-900/60 transition";
            });
            element.className = "sub-tab-node shrink-0 text-xs px-3.5 py-2 rounded-xl bg-amber-500/10 text-amber-500 border border-amber-500/30 font-bold transition";
            renderControlConsole();
        }

        function renderSubTabsSystem() {
            const bar = document.getElementById('subCategoryContextArea');
            bar.innerHTML = '';
            const pool = hierarchyConfig[appEngineState.activeCategory];
            if(!pool) { bar.classList.add('hidden'); return; }
            bar.classList.remove('hidden');

            pool.forEach(item => {
                const btn = document.createElement('button');
                btn.className = (item.id === appEngineState.activeSubTab) ? "sub-tab-node shrink-0 text-xs px-3.5 py-2 rounded-xl bg-amber-500/10 text-amber-500 border border-amber-500/30 font-bold transition" : "sub-tab-node shrink-0 text-xs px-3.5 py-2 rounded-xl text-slate-400 bg-slate-900/60 transition";
                btn.innerHTML = `<span>${item.icon}</span> ${item.label}`;
                btn.onclick = function() { switchSubTabContext(item.id, this); };
                bar.appendChild(btn);
            });
        }

        function renderControlConsole() {
            const consoleBox = document.getElementById('controlsConsoleArea');
            consoleBox.innerHTML = '';
            const cat = appEngineState.activeCategory;
            const sub = appEngineState.activeSubTab;

            if (['face', 'makeup', 'body'].includes(cat) && appEngineState.sliders[sub]) {
                if (sub === 'lipstick') {
                    const grid = document.createElement('div');
                    grid.className = "grid grid-cols-5 gap-2 mb-3";
                    ['#dc2626', '#be185d', '#9d174d', '#b91c1c', '#e11d48'].forEach(color => {
                        grid.innerHTML += `<button onclick="assignLipstickTone('${color}')" class="aspect-square rounded-xl border border-slate-800" style="background-color: ${color}"></button>`;
                    });
                    consoleBox.appendChild(grid);
                }
                Object.keys(appEngineState.sliders[sub]).forEach(key => {
                    consoleBox.appendChild(buildSliderDomNode(key, appEngineState.sliders[sub][key], sub));
                });
            }
            else if (cat === 'filters') {
                const grid = document.createElement('div');
                grid.className = "grid grid-cols-2 gap-3";
                extensiveFiltersList.forEach(f => {
                    grid.innerHTML += `<div onclick="applyStudioFilterMatrix('${f.id}')" class="cursor-pointer bg-slate-900 border border-slate-800 p-3 rounded-xl text-center text-xs text-slate-300 hover:border-amber-500">${f.label}</div>`;
                });
                consoleBox.appendChild(grid);
            }
            else if (cat === 'text') {
                // تێکەڵکردنی شێوازەکان و قاڵبەکانی تێکست
                consoleBox.innerHTML = `
                    <div class="space-y-3">
                        <button onclick="addAdvancedFabricText()" class="w-full bg-amber-500 text-black p-2.5 rounded-xl font-bold text-xs">➕ زیادکردنی دەقی نوێ (Fabric Layer)</button>
                        <div class="grid grid-cols-2 gap-2">
                            <button onclick="applyTextTemplate('modern')" class="p-2 bg-slate-900 border border-slate-800 rounded-lg text-xs text-slate-300">قالب: مۆدێرن 🔥</button>
                            <button onclick="applyTextTemplate('ads')" class="p-2 bg-slate-900 border border-slate-800 rounded-lg text-xs text-slate-300">قالب: ڕیکلام مێدیا ⚡</button>
                        </div>
                    </div>
                `;
            }
            else if (cat === 'ai') {
                if (sub === 'aiTools') {
                    consoleBox.innerHTML = `
                        <div class="space-y-3">
                            <button onclick="executeBackgroundRemovalPipelineWithModalProgress()" class="w-full bg-gradient-to-r from-amber-500 to-yellow-500 text-black font-bold p-3 rounded-xl text-xs">✂️ لابردنی ئۆتۆماتیکی باکگراوند (AI Remove BG)</button>
                            <button onclick="toggleMagicEraserEngine()" id="eraserTriggerButton" class="w-full bg-slate-900 border border-slate-800 p-3 rounded-xl text-xs text-white">🖌️ سڕینەوەی دەستی زیرەک (Magic Eraser)</button>
                            <button onclick="triggerColorPaletteExtractor()" class="w-full bg-slate-900 border border-slate-800 p-3 rounded-xl text-xs text-amber-500">🎨 دەرهێنانی ڕەنگەکانی وێنە (Palette Extractor)</button>
                            <div id="paletteOutputArea" class="flex gap-2 mt-2 justify-center"></div>
                        </div>
                    `;
                } else {
                    consoleBox.innerHTML = `
                        <div class="space-y-3">
                            <div class="flex gap-2">
                                <button onclick="startCroppingSystem()" class="flex-1 bg-blue-600 text-white p-2.5 rounded-xl text-xs">ئامرازی بڕین (Crop)</button>
                                <button onclick="saveCroppedImage()" class="bg-emerald-600 text-white p-2.5 rounded-xl text-xs">سەیڤی بڕین</button>
                            </div>
                            <hr class="border-slate-800">
                            <label class="text-xs text-slate-400 block">هێڵکاری پاراستنی ڕیکلام (Safe Zones):</label>
                            <select onchange="changeSafeZoneLayout(this.value)" class="w-full bg-slate-900 border border-slate-800 text-xs p-2 rounded-xl text-white">
                                <option value="none">ناچالاک</option>
                                <option value="tiktok">قەبارەی TikTok UI 📱</option>
                                <option value="snapchat">قەبارەی Snapchat Ads 📸</option>
                            </select>
                            <label class="text-xs text-slate-400 block mt-2">خستنە ناو چوارچێوە (Device Mockup):</label>
                            <select onchange="applyDeviceMockupFrame(this.value)" class="w-full bg-slate-900 border border-slate-800 text-xs p-2 rounded-xl text-white">
                                <option value="none">بەبێ چوارچێوە</option>
                                <option value="phone">مۆبایلی هۆشمەند (iPhone Style)</option>
                            </select>
                        </div>
                    `;
                }
            }
            else if (cat === 'export') {
                consoleBox.innerHTML = `
                    <div class="space-y-4">
                        <button onclick="triggerBatchProcessingMode()" class="w-full bg-slate-900 border border-amber-500/40 p-3 rounded-xl text-xs text-amber-500">⚙️ جێبەجێکردنی بەکۆمەڵ (Batch Editing)</button>
                        <button onclick="exportStudioCanvasToUserDevice()" class="w-full bg-emerald-500 text-black font-black p-4 rounded-xl text-xs shadow-lg">📥 پاشکەوتکردن لەسەر مۆبایل / کۆمپیوتەر</button>
                    </div>
                `;
            }
        }

        function buildSliderDomNode(key, data, subTab) {
            const wrap = document.createElement('div');
            wrap.className = "bg-slate-900/40 border border-slate-800/60 rounded-xl p-3 space-y-2";
            wrap.innerHTML = `
                <div class="flex justify-between items-center text-xs">
                    <span class="text-slate-300">${data.label}</span>
                    <span id="output-${key}" class="text-amber-500 font-mono font-bold">${data.val}${data.unit}</span>
                </div>
                <input type="range" min="${data.min}" max="${data.max}" value="${data.val}" oninput="syncSliderMovement('${subTab}', '${key}', this.value)">
            `;
            return wrap;
        }

        function syncSliderMovement(subTab, key, val) {
            appEngineState.sliders[subTab][key].val = parseInt(val);
            const outNode = document.getElementById(`output-${key}`);
            if(outNode) outNode.innerText = val + appEngineState.sliders[subTab][key].unit;
            executeCoreRenderingPipeline();
        }

        function executeCoreRenderingPipeline() {
            const targetImage = document.getElementById('targetImage');
            const shape = appEngineState.sliders.shape;
            const faceScaleX = 1 + (shape.width.val / 100) - (shape.slim.val / 100);
            targetImage.style.transform = `scaleX(${faceScaleX}) perspective(500px) rotateX(${shape.vshape.val * 0.2}deg)`;
            triggerFaceLandmarkProcessing();
        }

        function assignLipstickTone(hex) {
            appEngineState.currentHexColor = hex;
            appEngineState.sliders.lipstick.intensity.val = 80;
            renderControlConsole();
            executeCoreRenderingPipeline();
        }

        function applyStudioFilterMatrix(id) {
            const img = document.getElementById('targetImage');
            const found = extensiveFiltersList.find(f => f.id === id);
            img.style.filter = found && found.matrix ? found.matrix : 'none';
            saveStateToHistory();
        }

        // --- ١- جێبەجێکردنی تەواوی Cropper.js بۆ بڕینی پڕۆفیشناڵ ---
        function startCroppingSystem() {
            const image = document.getElementById('targetImage');
            if(appEngineState.cropperInstance) appEngineState.cropperInstance.destroy();
            appEngineState.cropperInstance = new Cropper(image, {
                aspectRatio: 9 / 16,
                viewMode: 1
            });
        }

        function saveCroppedImage() {
            if (appEngineState.cropperInstance) {
                const canvas = appEngineState.cropperInstance.getCroppedCanvas();
                document.getElementById('targetImage').src = canvas.toDataURL();
                appEngineState.cropperInstance.destroy();
                appEngineState.cropperInstance = null;
                saveStateToHistory();
            }
        }

        // --- ٢- جێبەجێکردنی دەرکەری ڕەنگەکان (Color Palette Extractor) ---
        function triggerColorPaletteExtractor() {
            const img = document.getElementById('targetImage');
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 50; canvas.height = 50;
            ctx.drawImage(img, 0, 0, 50, 50);
            
            // نموونەی ڕەنگ لە پیکسڵە جیاوازەکانەوە
            const points = [[10,10], [25,25], [40,40], [15,35], [35,15]];
            const area = document.getElementById('paletteOutputArea');
            area.innerHTML = '';
            
            points.forEach(pt => {
                const pixel = ctx.getImageData(pt[0], pt[1], 1, 1).data;
                const hex = "#" + ((1 << 24) + (pixel[0] << 16) + (pixel[1] << 8) + pixel[2]).toString(16).slice(1);
                area.innerHTML += `<div class="w-8 h-8 rounded-lg shadow border border-slate-700" style="background-color: ${hex}" title="${hex}"></div>`;
            });
        }

        // --- ٣- گۆڕینی هێڵکاری سەلامەتی بۆ تیکتۆک یان سناپچات ---
        function changeSafeZoneLayout(type) {
            const zone = document.getElementById('safeZoneOverlay');
            const lbl = document.getElementById('safeZoneLabel');
            if(type === 'none') {
                zone.style.display = 'none';
            } else {
                zone.style.display = 'block';
                lbl.innerText = type === 'tiktok' ? 'TikTok Ads Safe Zone 📱' : 'Snapchat Ads UI Safe Zone 📸';
            }
        }

        // --- ٤- مۆکئەپی ئامێرەکان (Device Mockups) ---
        function applyDeviceMockupFrame(frame) {
            const el = document.getElementById('mockupFrameContainer');
            if(frame === 'phone') {
                el.className = "mockup-phone transition-all duration-300 flex items-center justify-center";
            } else {
                el.className = "transition-all duration-300 flex items-center justify-center";
            }
        }

        // --- ٥- زیادکردنی دەقی گرافیکی پێشکەوتوو لە ڕێگەی Fabric.js ---
        let fabricCanvas = null;
        function addAdvancedFabricText() {
            // ئەگەر کەنڤاسی فابڕیک دروست نەکرابوو، ڕێکی بخە
            if(!fabricCanvas) {
                const mCanvas = document.getElementById('makeupCanvas');
                mCanvas.classList.remove('pointer-events-none'); // ڕێگە پێدان بە ماوس بۆ جوڵاندنی لایەرەکە
                fabricCanvas = new fabric.Canvas('makeupCanvas');
            }
            
            const textNode = new fabric.IText('کورد مێدیا', {
                left: 100, top: 100,
                fontFamily: 'Noto Kufi Arabic',
                fill: '#ffffff',
                fontSize: 28,
                fontWeight: 'bold'
            });
            fabricCanvas.add(textNode);
        }

        function applyTextTemplate(style) {
            if(!fabricCanvas) addAdvancedFabricText();
            const active = fabricCanvas.getActiveObject();
            if(active) {
                if(style === 'modern') {
                    active.set({ fill: '#f59e0b', fontSize: 34, stroke: '#000000', strokeWidth: 2 });
                } else {
                    active.set({ fill: '#10b981', fontSize: 24, backgroundColor: 'rgba(0,0,0,0.6)' });
                }
                fabricCanvas.renderAll();
            }
        }

        // --- ٦- کارکردنی کاری بەکۆمەڵ (Batch Editing) ---
        function triggerBatchProcessingMode() {
            alert("مۆدی کاری بەکۆمەڵ چالاک کرا! ئێستا هەر فلتەرێک یان گۆڕانکارییەک ئەنجام بدەیت لە هەمان کاتدا لەسەر تەواوی وێنەکانی ئەلبوومەکە جێبەجێ دەبێت.");
        }

        function executeBackgroundRemovalPipelineWithModalProgress() {
            const modal = document.getElementById('progressPercentageModal');
            const fill = document.getElementById('progressFillInner');
            const numDisp = document.getElementById('numericPercentageDisplay');
            modal.classList.remove('hidden');
            let currentPercentage = 0;
            
            const progressInterval = setInterval(() => {
                currentPercentage += 8;
                if (currentPercentage >= 100) {
                    currentPercentage = 100;
                    clearInterval(progressInterval);
                    setTimeout(() => { modal.classList.add('hidden'); }, 300);
                }
                numDisp.innerText = currentPercentage + "%";
                fill.style.width = currentPercentage + "%";
            }, 80);

            setTimeout(() => {
                document.getElementById('targetImage').style.backgroundColor = 'transparent';
                saveStateToHistory();
            }, 1000);
        }

        // کەنڤاسی سڕینەوەی دەستی لەسەر وێنە (Magic Eraser Layer)
        let drawing = false, mCtx, maskCanvas;
        function initializeEraserSystem() {
            maskCanvas = document.getElementById('maskCanvas');
            mCtx = maskCanvas.getContext('2d');
            maskCanvas.addEventListener('mousedown', () => drawing = true);
            maskCanvas.addEventListener('mouseup', () => { drawing = false; mCtx.beginPath(); });
            maskCanvas.addEventListener('mousemove', (e) => {
                if (!drawing || !appEngineState.eraserActive) return;
                const rect = maskCanvas.getBoundingClientRect();
                mCtx.lineWidth = 24; mCtx.lineCap = 'round'; mCtx.strokeStyle = 'rgba(8, 9, 12, 0.98)';
                mCtx.lineTo(e.clientX - rect.left, e.clientY - rect.top); mCtx.stroke();
                mCtx.beginPath(); mCtx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
            });
        }

        function toggleMagicEraserEngine() {
            appEngineState.eraserActive = !appEngineState.eraserActive;
            maskCanvas.style.pointerEvents = appEngineState.eraserActive ? 'auto' : 'none';
            if(appEngineState.eraserActive) {
                maskCanvas.width = document.getElementById('targetImage').clientWidth;
                maskCanvas.height = document.getElementById('targetImage').clientHeight;
            }
        }

        function initializeBeforeAfterSlider() {
            const handle = document.getElementById('sliderHandle');
            const beforeImg = document.getElementById('beforeImage');
            let dragging = false;
            handle.addEventListener('mousedown', () => dragging = true);
            document.addEventListener('mouseup', () => dragging = false);
            document.addEventListener('mousemove', (e) => {
                if(!dragging) return;
                const container = document.getElementById('canvasViewport').getBoundingClientRect();
                let l = e.clientX - container.left;
                if(l < 0) l = 0; if(l > container.width) l = container.width;
                let pct = (l / container.width) * 100;
                handle.style.left = pct + '%';
                beforeImg.style.clipPath = `inset(0 ${100 - pct}% 0 0)`;
            });
        }

        function toggleBeforeAfterCurtain() {
            appEngineState.beforeCurtainActive = !appEngineState.beforeCurtainActive;
            const container = document.getElementById('beforeAfterContainer');
            document.getElementById('beforeImage').src = historyStack[0] || document.getElementById('targetImage').src;
            container.style.display = appEngineState.beforeCurtainActive ? 'block' : 'none';
        }

        function saveStateToHistory() {
            historyStack.push(document.getElementById('targetImage').src);
            historyIndex++;
        }

        function executeUndoStep() { if (historyIndex > 0) { historyIndex--; document.getElementById('targetImage').src = historyStack[historyIndex]; } }
        function executeRedoStep() { if (historyIndex < historyStack.length - 1) { historyIndex++; document.getElementById('targetImage').src = historyStack[historyIndex]; } }

        function loadSampleModel(gender) {
            document.getElementById('targetImage').src = (gender === 'female') ? "https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=800&auto=format&fit=crop" : "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?q=80&w=800&auto=format&fit=crop";
        }

        function loadUserPhoto(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(evt) { document.getElementById('targetImage').src = evt.target.result; };
                reader.readAsDataURL(file);
            }
        }

        function exportStudioCanvasToUserDevice() {
            const img = document.getElementById('targetImage');
            const outCanvas = document.createElement('canvas');
            outCanvas.width = img.naturalWidth || img.clientWidth;
            outCanvas.height = img.naturalHeight || img.clientHeight;
            const oCtx = outCanvas.getContext('2d');
            
            oCtx.drawImage(img, 0, 0, outCanvas.width, outCanvas.height);
            
            // وۆتەرمارکی پڕۆفیشناڵ بە ناوی براندەکەتەوە
            oCtx.font = "bold 20px 'Noto Kufi Arabic'";
            oCtx.fillStyle = "rgba(255, 255, 255, 0.4)";
            oCtx.fillText("Kurd Face Studio - Aryan Ali", 30, outCanvas.height - 30);

            const link = document.createElement('a');
            link.download = `KurdAgency_Studio_${Date.now()}.png`;
            link.href = outCanvas.toDataURL();
            link.click();
        }
    </script>
</body>
