<style>
:root{--bg:#0b2a3b;--bar:#0f3549;--card:#134059;--bd:#1f5774;--tx:#eaf7ff;--mu:#93b5c9;--ac:#0a96d8;--ac2:#3cc4ff;--in:#0d3248;--ok:#22c55e;--no:#f43f5e;--sh:0 8px 28px rgba(0,0,0,.25)}
[data-theme=light]{--bg:#e8f2f8;--bar:#fff;--card:#fff;--bd:#cfe0ea;--tx:#0d2a3a;--mu:#587487;--ac:#0580b8;--ac2:#0a96d8;--in:#f1f7fb;--sh:0 8px 24px rgba(16,57,75,.1)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--tx);font-family:"Noto Sans Arabic","Segoe UI",Tahoma,sans-serif;line-height:1.65;min-height:100vh}
h1,h2,h3,.kf{font-family:"Noto Kufi Arabic","Noto Sans Arabic",sans-serif}
button,input,select{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:20;background:var(--bar);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:8px;padding:9px 14px;box-shadow:var(--sh)}
header img{height:34px;display:block}.ads{background:var(--ac);color:#fff;font-weight:800;font-size:.7rem;padding:2px 8px;border-radius:6px;direction:ltr;margin-inline-end:auto}
.chip{background:var(--in);border:1px solid var(--bd);border-radius:10px;padding:6px 11px;font-size:.85rem;cursor:pointer;font-weight:700}
nav{display:flex;gap:6px;padding:10px 14px;overflow-x:auto;max-width:1000px;margin:0 auto}
nav button{background:var(--card);border:1px solid var(--bd);border-radius:999px;padding:8px 16px;font-weight:700;color:var(--mu);cursor:pointer;white-space:nowrap}
nav button.on{background:var(--ac);border-color:var(--ac);color:#fff}
main{max-width:1000px;margin:0 auto;padding:6px 14px 60px}
.hero{display:flex;align-items:center;gap:18px;flex-wrap:wrap;background:linear-gradient(135deg,#0f4a68,#0a7fb5);border-radius:20px;padding:22px;margin-bottom:16px;position:relative;overflow:hidden;color:#fff;box-shadow:var(--sh)}
.hero:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(45deg,rgba(255,255,255,.04) 0 14px,transparent 14px 28px)}
.hero>*{position:relative}.hero img{width:min(300px,100%);filter:brightness(0) invert(1)}.hero div{flex:1;min-width:220px}.hero h1{font-size:1.25rem;margin-bottom:4px}.hero p{opacity:.9;font-size:.92rem}
.top{display:flex;margin-bottom:12px}
.back{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:9px 16px;font-weight:800;cursor:pointer;display:flex;gap:8px;align-items:center;box-shadow:var(--sh)}
.back:hover{border-color:var(--ac2)}
.steps{display:flex;margin-bottom:16px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:6px;gap:4px}
.steps button{flex:1;background:none;border:0;border-radius:10px;padding:8px 2px;font-size:.78rem;font-weight:700;color:var(--mu);cursor:default;display:flex;flex-direction:column;align-items:center;gap:2px}
.steps b{width:26px;height:26px;border-radius:50%;background:var(--in);border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;font-size:.8rem}
.steps .on{background:var(--in);color:var(--tx)}.steps .on b{background:var(--ac);border-color:var(--ac);color:#fff}
.steps .dn{cursor:pointer;color:var(--ac2)}.steps .dn b{background:var(--ok);border-color:var(--ok);color:#fff}.steps .dn:hover{background:var(--in)}
.lay{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:800px){.lay.two{grid-template-columns:1fr 300px}.sum{position:sticky;top:76px;align-self:start}}
.box{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;box-shadow:var(--sh)}
h2{font-size:1.1rem;margin-bottom:14px}h3{font-size:1rem;margin-bottom:8px}
.pg{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}@media(min-width:640px){.pg{grid-template-columns:repeat(3,1fr)}}
.pc{background:var(--in);border:1px solid var(--bd);border-radius:16px;padding:20px 8px 16px;text-align:center;cursor:pointer;font-weight:800;font-size:.92rem;transition:.2s;position:relative}
.pc:hover{transform:translateY(-3px);border-color:var(--ac2);box-shadow:var(--sh)}
.lg{display:flex;width:54px;height:54px;border-radius:15px;align-items:center;justify-content:center;margin:0 auto 10px}.lg svg{width:30px;height:30px}
.sm .lg{width:36px;height:36px;border-radius:10px;margin:0}.sm .lg svg{width:20px;height:20px}
.tier{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--in);border:1px solid var(--bd);border-radius:12px;padding:13px 15px;margin-bottom:9px;cursor:pointer;width:100%;text-align:start}
.tier.on{border-color:var(--ac2);box-shadow:0 0 0 2px color-mix(in srgb,var(--ac2) 35%,transparent)}.tier b{direction:ltr;color:var(--ac2);white-space:nowrap}
.fg{margin-bottom:12px}label{display:block;font-size:.82rem;font-weight:700;color:var(--mu);margin-bottom:4px}
input[type=text],input[type=url],input[type=tel],input[type=number],select{width:100%;background:var(--in);border:1px solid var(--bd);border-radius:10px;padding:11px 12px;outline:none}
input:focus,select:focus{border-color:var(--ac2)}
.ages{display:flex;flex-wrap:wrap;gap:6px}.ages button{background:var(--in);border:1px solid var(--bd);border-radius:10px;padding:7px 12px;cursor:pointer;font-weight:700;direction:ltr}.ages .on{background:var(--ac);color:#fff;border-color:var(--ac)}
.btn{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border:0;border-radius:12px;padding:12px 20px;font-weight:800;cursor:pointer}
.btn.g{background:var(--in);color:var(--tx);border:1px solid var(--bd)}.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:10px;margin-top:14px;justify-content:flex-end;flex-wrap:wrap}.row.s{justify-content:flex-start}
.nt{border-inline-start:4px solid var(--ac2);background:var(--in);padding:10px 12px;border-radius:10px;font-size:.85rem;color:var(--mu);margin-top:10px}.nt.r{border-color:var(--no);color:var(--no)}
.sum dl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;font-size:.88rem;margin-top:10px}.sum dt{color:var(--mu)}.sum dd{font-weight:800;text-align:end}.sum dd span{direction:ltr;display:inline-block}
.sm{display:flex;align-items:center;gap:10px;font-weight:800}
.est{margin-top:12px;padding:12px;border-radius:12px;background:var(--in);text-align:center}.est b{display:block;color:var(--ac2);font-size:1.05rem;direction:ltr}
.ck{display:flex;gap:8px;align-items:center;margin-top:12px;font-weight:700}.ck input{width:18px;height:18px;accent-color:var(--ac)}
.g2{display:grid;gap:12px}@media(min-width:600px){.g2{grid-template-columns:1fr 1fr}}
.gr6,.gr2{display:grid;gap:8px;margin:12px auto;direction:ltr}.gr6{grid-template-columns:repeat(6,1fr);max-width:440px}.gr2{grid-template-columns:1fr 1fr;max-width:280px}
.cd{aspect-ratio:1;font-size:1.3rem;background:var(--in);border:1px solid var(--bd);border-radius:10px;cursor:pointer}.cd.on{background:var(--ac);color:#fff}
.pad{aspect-ratio:1;border:0;border-radius:18px;opacity:.45;cursor:pointer;transition:.1s}.pad.lit{opacity:1;transform:scale(1.05);box-shadow:0 0 24px currentColor}
.ar{position:relative;height:320px;background:var(--in);border:1px dashed var(--bd);border-radius:14px;overflow:hidden;margin:12px 0;direction:ltr}
.tg{position:absolute;border-radius:50%;border:0;background:transparent;font-size:1.6rem;cursor:pointer}
.big{font-size:2.2rem;font-weight:900;color:var(--ac2)}
.rw{display:grid;gap:10px;margin:14px 0}@media(min-width:640px){.rw{grid-template-columns:repeat(3,1fr)}}
.rc{background:var(--in);border:1px solid var(--bd);border-radius:14px;padding:14px;text-align:center}.rc b{display:block;font-size:1.05rem}.rc small{color:var(--mu)}
.bar{height:8px;border-radius:6px;background:var(--bd);margin:10px 0;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2))}
.sv{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;margin-bottom:12px;box-shadow:var(--sh)}
.pm{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pi{border-radius:14px;padding:18px 8px;text-align:center;font-weight:900;font-size:1.1rem;color:#fff;direction:ltr}
.qa{margin-bottom:10px}.qa b{color:var(--ac2);display:block}
body{background:radial-gradient(900px 500px at 90% -10%,rgba(10,150,216,.28),transparent 60%),radial-gradient(700px 420px at 0% 30%,rgba(60,196,255,.12),transparent 60%),var(--bg);background-attachment:fixed}
.hero{display:flex;align-items:center;justify-content:center;min-height:38px;padding:0 14px;border-radius:10px;font-weight:800;font-size:.85rem;margin-bottom:12px;gap:0}
.top{gap:8px;flex-wrap:wrap}
.fx{animation:up .3s ease}@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.box{background:linear-gradient(180deg,rgba(255,255,255,.05),transparent 40%),var(--card)}
.pc{background:linear-gradient(180deg,rgba(255,255,255,.05),transparent),var(--in);--g:var(--ac2)}
.pc:hover{border-color:var(--g);box-shadow:0 10px 30px color-mix(in srgb,var(--g) 30%,transparent)}
.lg{box-shadow:0 6px 16px rgba(0,0,0,.3)}
.rg{display:inline-flex;gap:.45em;align-items:center;justify-content:center;flex-wrap:wrap}.rg>span{unicode-bidi:isolate;white-space:nowrap}.rg .to{color:var(--mu);font-weight:600}
.tier .tl{flex:1;display:flex;flex-direction:column;align-items:flex-start;gap:2px;font-weight:700}.tier .tl small{color:var(--mu);font-weight:500}
.rd{width:18px;height:18px;border-radius:50%;border:2px solid var(--bd);flex:none}.tier.on .rd{border-color:var(--ac2);background:radial-gradient(var(--ac2) 45%,transparent 50%)}
.or{display:flex;align-items:center;gap:10px;margin:18px 0;color:var(--mu);font-weight:700}.or:before,.or:after{content:"";flex:1;height:1px;background:var(--bd)}
.cbox{border:2px dashed var(--bd);border-radius:16px;padding:16px;background:linear-gradient(135deg,rgba(60,196,255,.08),transparent)}.cbox.on{border:2px solid var(--ac2)}.cbox p{color:var(--mu);font-size:.85rem;margin-bottom:12px}
.est b{direction:inherit;font-size:1.1rem}
.rvb{border:1px solid var(--bd);border-radius:14px;overflow:hidden}.rv{display:flex;justify-content:space-between;gap:12px;padding:11px 14px;align-items:center}.rv:nth-child(odd){background:var(--in)}.rv span{color:var(--mu);font-size:.85rem}.rv b{text-align:end;word-break:break-word;max-width:65%}
a.btn{display:inline-block;text-decoration:none;text-align:center}.btn.dis{opacity:.4;pointer-events:none}
.btn{box-shadow:0 6px 18px color-mix(in srgb,var(--ac) 40%,transparent)}.btn.g{box-shadow:none}
footer{text-align:center;color:var(--mu);font-size:.78rem;padding:22px 14px 30px;border-top:1px solid var(--bd);max-width:1000px;margin:0 auto}
</style>
</head>

 const s=D[P].u=='l'?10:100;return a.map(v=>Math.floor(v/s)*s)}

function estT(P,x,l){const e=est(x,P),u=eu(P,l);return `\u2067${fmt(e[0])} ${u}\u2069 ${l?T.to[LI[l]]:t('to')} \u2067${fmt(e[1])} ${u}\u2069`}
function estH(P,x){const e=est(x,P),u=eu(P);return `<span class="rg"><span>${fmt(e[0])} ${u}</span><span class="to">${t('to')}</span><span>${fmt(e[1])} ${u}</span></span>`}
const maxDays=p=>p<=10000?2:p<=15000?3:p<=20000?5:p<=25000?6:8;
const esc=s=>String(s||'').replace(/"/g,'&quot;').replace(/</g,'&lt;');
function reset(){S={st:1,p:null,pr:0,f:{ag:[]},pay:'',ok:0}}
reset();

function setLang(l){lang=l;localStorage.kl=l;render()}
function theme(){const d=document.documentElement,l=d.dataset.theme=='light';d.dataset.theme=l?'':'light';$('th').textContent=l?'☀️':'🌙';localStorage.kt=l?'':'light'}
function go(v){stop();V=v;render()}
function render(){
 const d=document.documentElement;d.lang=lang;d.dir=lang=='en'?'ltr':'rtl';$('lg').value=lang;
 $('pt').textContent='⭐ '+pts;
 $('ft').textContent=t('foot');$('nv').innerHTML=[['c','nc'],['s','ns'],['p','np'],['i','ni'],['g','ng']].map(a=>`<button class="${V==a[0]?'on':''}" onclick="go('${a[0]}')">${t(a[1])}</button>`).join('');
 $('app').innerHTML={c:camp,g:games,s:srv,i:info,p:payTab}[V]();
 if(V=='c'){sum();updSend()}
 window.scrollTo(0,0)}

/* ---------- Campaign ---------- */
const GL={fb:'#1877f2',ig:'#e1306c',sc:'#fffc00',tb:'#00f2fe',tp:'#fe0979',tl:'#a855f7'};
const tv=v=>{for(const k of ['kurd','arab','both','all2','male','female','wa','igc','ph','allA'])if(T[k][0]==v)return t(k);return v};
function camp(){
 const ar=lang=='en'?'←':'→';
 const top=S.st>1?`<div class="top"><button class="back" onclick="S.st=${S.st-1};render()">${ar} ${t('bk')}</button><button class="back" onclick="S.st=1;render()">⟲ ${t('home')}</button></div>`:'';
 const stp=['s1','s2','s3','s4'].map((k,i)=>`<button class="${S.st==i+1?'on':S.st>i+1?'dn':''}" ${S.st>i+1?`onclick="S.st=${i+1};render()"`:''}><b>${S.st>i+1?'✓':i+1}</b>${t(k)}</button>`).join('');
 const hero=S.st==1?`<div class="hero">${t('hero')}</div>`:'';
 return `${top}${hero}<div class="steps">${stp}</div><div class="lay ${S.st>1?'two':''}"><div class="box fx">${[0,st1,st2,st3,st4][S.st]()}</div>${S.st>1?'<div class="box sum" id="sm"></div>':''}</div>`}
function st1(){return `<h2>${t('choose')}</h2><div class="pg">${Object.keys(D).map(k=>`<div class="pc" style="--g:${GL[k]}" onclick="pick('${k}')">${ico(k)}${t('p_'+k)}</div>`).join('')}</div>`}
function pick(k){if(S.p!=k){S.p=k;S.pr=0;S.cu='';S.src='';S.f={ag:[]}}S.st=2;render()}
function nxt(a,dis){return `<div class="row"><button class="btn" id="nx" onclick="${a}" ${dis?'disabled':''}>${t('nx')}</button></div>`}
const okPr=()=>S.pr>=D[S.p].m;
function crHtml(){if(!S.cu)return '';return S.pr?`<div class="est">${t('es')}<b>${estH(S.p,S.pr)}</b></div>`:`<div class="nt r">${t('mn').replace('{m}',fmt(D[S.p].m))}</div>`}
function st2(){const d=D[S.p];
 return `<h2>${t('bud')}</h2>${d.r.map((r,i)=>`<button class="tier ${S.src=='t'&&S.pr==r[0]?'on':''}" data-p="${r[0]}" onclick="setPr(${r[0]})"><i class="rd"></i><span class="tl">${estH(S.p,r[0])}${d.d?`<small>${d.d[i]} ${t('dl')}</small>`:''}</span><b>${fmt(r[0])} IQD</b></button>`).join('')}
 <div class="or"><span>${t('or')}</span></div>
 <div class="cbox ${S.src=='c'?'on':''}" id="cb"><h3>${t('oth')}</h3><p>${t('othD')}</p><div class="fg"><label>${t('cin').replace('{m}',fmt(d.m))}</label><input type="number" inputmode="numeric" id="cu" value="${esc(S.cu)}" placeholder="${fmt(d.m)}" oninput="cust(this.value)"></div><div id="cr">${crHtml()}</div></div>${nxt('goS3()',!okPr())}`}
function setPr(v){S.pr=v;S.src='t';S.cu='';$('cu').value='';$('cr').innerHTML='';$('cb').classList.remove('on');document.querySelectorAll('.tier').forEach(x=>x.classList.toggle('on',+x.dataset.p==v));sum();$('nx').disabled=false}
function cust(v){S.cu=v;S.src='c';const n=+v;S.pr=n>=D[S.p].m?n:0;$('cr').innerHTML=crHtml();$('cb').classList.add('on');document.querySelectorAll('.tier').forEach(x=>x.classList.remove('on'));sum();$('nx').disabled=!okPr()}
function goS3(){try{ttq.track('InitiateCheckout')}catch(e){}if(D[S.p].f.includes('dy')&&(+S.f.dy||1)>maxDays(S.pr))S.f.dy='1';S.st=3;render()}
function inp(c,l,ty='text'){return `<div class="fg"><label>${t(l)}</label><input type="${ty}" value="${esc(S.f[c])}" oninput="S.f.${c}=this.value;chk()"></div>`}
function sel(c,l,o){return `<div class="fg"><label>${t(l)}</label><select onchange="S.f.${c}=this.value;chk()"><option value="" disabled ${S.f[c]?'':'selected'}>—</option>${o.map(k=>{const v=T[k][0];return `<option value="${esc(v)}" ${S.f[c]==v?'selected':''}>${t(k)}</option>`}).join('')}</select></div>`}
function st3(){const f=D[S.p].f.split(' ');let h='';
 f.forEach(c=>{
  if(c=='pg')h+=inp('pg',S.p=='tl'?'pgl':'pg');
  if(c=='lk')h+=inp('lk','lk','url');
  if(c=='bz')h+=inp('bz','bz');
  if(c=='ct')h+=inp('ct','ct');
  if(c=='au')h+=sel('au','au',['kurd','arab','both']);
  if(c=='gd')h+=sel('gd','gd',['all2','male','female']);
  if(c=='dy'){const m=maxDays(S.pr);h+=`<div class="fg"><label>${t('dy')}</label><select onchange="S.f.dy=this.value;sum()">${Array.from({length:m},(_,i)=>`<option value="${i+1}" ${(+S.f.dy||1)==i+1?'selected':''}>${i+1} ${t('dd')}</option>`).join('')}</select></div>`}
 });
 if(f.includes('ag'))h+=`<div class="fg"><label>${t('ag')}</label><div class="ages">${['allA','18_24','24_36','36_45','45_55','55_65'].map(a=>{const v=a=='allA'?T.allA[0]:a;return `<button type="button" data-v="${v}" class="${S.f.ag.includes(v)?'on':''}" onclick="age('${v}',this)">${a=='allA'?t(a):a}</button>`}).join('')}</div></div>`;
 if(f.includes('cm')){h+=sel('cm','cm',['wa','igc','ph']);h+=inp('cd','cd')}
 h+=notes();return `<h2>${t('s3')}</h2>${h}${nxt('S.st=4;render()',!ok3())}`}
function age(v,b){const a=S.f.ag,A=T.allA[0];if(v==A)S.f.ag=a.includes(A)?[]:[A];else{S.f.ag=a.filter(x=>x!=A);const i=S.f.ag.indexOf(v);i>-1?S.f.ag.splice(i,1):S.f.ag.push(v)}
 b.parentNode.querySelectorAll('button').forEach(x=>x.classList.toggle('on',S.f.ag.includes(x.dataset.v)));chk()}
function ok3(){const f=D[S.p].f.split(' ');return f.every(c=>c=='dy'?1:c=='ag'?S.f.ag.length:c=='cm'?S.f.cm&&(S.f.cd||'').trim():(S.f[c]||'').trim())}
function chk(){const b=$('nx');if(b&&S.st==3)b.disabled=!ok3();updSend()}
function notes(){const p=S.p,pv=p[0]=='t'?'TikTok':'Meta';let h='';
 if(p!='tl')h+=`<div class="nt">${t('vN').replace('{p}',pv)}</div>`;
 if(p!='sc'&&p!='tl')h+=`<div class="nt">${t('eN')}</div>`;
 h+=`<div class="nt r">${t('tm').replace('{h}',p[0]=='t'?'1-2':'3-4')}</div>`;
 const n={tb:'nTk',tp:'nTk',fb:'nMeta',ig:'nIg',sc:'nSc',tl:'nLk'}[p];h+=`<div class="nt">${t(n)}</div>`;return h}
function rows(){const f=S.f,h=D[S.p].f.split(' ');
 const L=[[t('pf'),`<span class="sm">${ico(S.p)}<span>${t('p_'+S.p)}</span></span>`],[t('es'),estH(S.p,S.pr)],[t('pr'),`<span dir="ltr">${fmt(S.pr)} IQD</span>`]];
 const add=(c,l,v)=>{if(h.includes(c)&&v)L.push([t(l),tv(v)])};
 add('pg',S.p=='tl'?'pgl':'pg',esc(f.pg));add('lk','lk',esc(f.lk));add('bz','bz',esc(f.bz));add('ct','ctS',esc(f.ct));add('au','au',f.au);add('gd','gd',f.gd);
 if(h.includes('ag'))L.push([t('agS'),f.ag.map(tv).join('، ')]);
 if(h.includes('dy'))L.push([t('dy'),(f.dy||1)+' '+t('dd')]);
 if(h.includes('cm'))L.push([t('cmS'),tv(f.cm)+' ('+esc(f.cd)+')']);
 return L}
function st4(){
 return `<h2>${t('s4')}</h2><div class="rvb">${rows().map(r=>`<div class="rv"><span>${r[0]}</span><b>${r[1]}</b></div>`).join('')}</div>
 <div class="fg" style="margin-top:16px"><label>${t('pay')}</label><select onchange="S.pay=this.value;chk()"><option value="" disabled ${S.pay?'':'selected'}>—</option>${Object.keys(PAYN).map(x=>`<option ${S.pay==x?'selected':''}>${x}</option>`).join('')}</select></div>
 <label class="ck"><input type="checkbox" ${S.ok?'checked':''} onchange="S.ok=this.checked;chk()"> ${t('ag2')}</label>${notes()}
 <div class="row"><button class="btn g" onclick="S.st=1;render()">⟲ ${t('home')}</button><a id="sd" class="btn dis" target="_blank" rel="noopener" onclick="sent(event)">${t('send')}</a></div>`}
function sum(){const el=$('sm');if(!el||!S.p)return;const ok=okPr();
 el.innerHTML=`<div class="sm">${ico(S.p)}<span>${t('p_'+S.p)}</span></div><dl><dt>${t('pr')}</dt><dd><span>${ok?fmt(S.pr)+' IQD':'—'}</span></dd>${S.f.dy&&D[S.p].f.includes('dy')?`<dt>${t('dy')}</dt><dd>${S.f.dy} ${t('dd')}</dd>`:''}</dl><div class="est">${t('es')}<b>${ok?estH(S.p,S.pr):'—'}</b></div>`}
function msg(){const d=D[S.p],f=S.f;
 let m=`سڵاو کورد ئەجێنسی، دەمەوێت داواکاریەکی نوێ بکەم:\nپلاتفۆرم: ${d.k}\nپاکێج: ${estT(S.p,S.pr,'ku')}\nنرخ: ${fmt(S.pr)} IQD`;
 if(d.f.includes('dy'))m+=`\nماوەی سپۆنسەر: ${f.dy||1} ڕۆژ`;
 if(S.p=='tl'){m+=`\n---------\nناوی داواکار یان پەیج: ${f.pg}\nلینکی پۆست: ${f.lk}`}
 else{m+=`\n---------\nناوی پەیج: ${f.pg}`;if(f.lk)m+=`\nلینکی پۆست: ${f.lk}`;m+=`\nجۆری کار: ${f.bz}`;
  if(f.cm)m+=`\nپەیوەندی کڕیار لە ڕێگەی: ${f.cm} (${f.cd})`;
  m+=f.au?`\nبینەر: ${f.au}`:`\nشارەکان: ${f.ct}`;
  m+=`\nڕەگەز: ${f.gd}\nتەمەن: ${f.ag.join('، ')}`}
 return m+`\nشێوازی پارەدان: ${S.pay}\nڕەزامەندی مەرجەکان: وەرگیراوە`}
const waUrl=m=>`https://wa.me/${WA}?text=${encodeURIComponent(m)}`;
function updSend(){const a=$('sd');if(!a)return;const ok=S.pay&&S.ok;a.classList.toggle('dis',!ok);if(ok)a.href=waUrl(msg());else a.removeAttribute('href')}
function sent(e){const a=$('sd');if(a.classList.contains('dis')){e.preventDefault();return}try{ttq.track('PlaceAnOrder')}catch(x){}setTimeout(()=>{reset();render()},600)}

/* ---------- Games ---------- */
function games(){const rw=REW.map(r=>`<div class="rc"><b>${t('sp').replace('{n}',fmt(r[1]))}</b><small>${fmt(r[0])} ${t('pn')}</small><div class="bar"><i style="width:${Math.min(100,pts/r[0]*100)}%"></i></div><button class="btn" ${pts>=r[0]?'':'disabled'} onclick="redeem(${r[0]},${r[1]})">${t('rq')}</button></div>`).join('');
 return `<div class="box"><h2>${t('gt')}</h2><div class="big">⭐ ${fmt(pts)}</div><p style="color:var(--mu);font-size:.85rem">${t('rwd')}</p><div class="rw">${rw}</div>
 <div class="row s"><button class="btn" onclick="memory()">🧠 ${t('gm')}</button><button class="btn" onclick="aim()">🎯 ${t('ga')}</button><button class="btn" onclick="simon()">🎹 ${t('gq')}</button></div><div class="nt">${t('gnote')}</div></div>
 <div class="box" style="margin-top:14px;text-align:center"><div id="gs" style="font-weight:800"></div><div id="ga"></div><div id="gr" style="font-weight:800;margin-top:8px"></div></div>`}
function stop(){clearInterval(window.tmr);clearTimeout(window.w)}
function addPts(p){const d=new Date().toDateString();if(localStorage.kd!=d){localStorage.kd=d;localStorage.kg=0}
 const a=Math.max(0,Math.min(p,DAILY-(+localStorage.kg||0)));localStorage.kg=(+localStorage.kg||0)+a;pts+=a;localStorage.kp=pts;$('pt').textContent='⭐ '+pts;return a}
function done(p){stop();const a=p>0?addPts(p):0;$('gr').textContent=a>0?t('win').replace('{n}',a):p>0?t('cap'):t('lose');$('gr').style.color=a>0?'var(--ok)':'var(--no)'}
function redeem(c,n){if(pts<c||!confirm(t('cf').replace('{c}',c)))return;pts-=c;localStorage.kp=pts;
 window.open(`https://wa.me/${WA}?text=${encodeURIComponent(`سڵاو کورد ئەجێنسی، من ${c} پۆینتم بەکارهێنا بۆ سپۆنسەرێکی ${fmt(n)} دینار.`)}`,'_blank');render()}
function memory(){stop();$('gr').textContent='';
 const E=['🔥','💎','🚀','⭐','🎯','👑','⚡','🎁','🌙','🍀','🦅','🏆'],c=[...E,...E].sort(()=>Math.random()-.5);let o=[],mv=26,ok=0,lk=0,fin=0,tm=90;
 const st=()=>$('gs').textContent=`${t('gmd')} | ❤ ${mv} · ⏱ ${tm} · ✔ ${ok}/12`;
 $('ga').innerHTML=`<div class="gr6">${c.map((_,i)=>`<button class="cd" data-i="${i}">?</button>`).join('')}</div>`;st();
 window.tmr=setInterval(()=>{tm--;st();if(tm<=0&&!fin){fin=1;done(0)}},1000);
 document.querySelectorAll('.cd').forEach(b=>b.onclick=()=>{
  if(lk||fin||b.classList.contains('on'))return;
  b.textContent=c[b.dataset.i];b.classList.add('on');o.push(b);
  if(o.length==2){mv--;const[a,d]=o;
   if(c[a.dataset.i]==c[d.dataset.i]){ok++;o=[]}
   else{lk=1;setTimeout(()=>{a.textContent=d.textContent='?';a.classList.remove('on');d.classList.remove('on');o=[];lk=0},550)}
   st();if(ok==12){fin=1;done(8+Math.floor(mv/2))}else if(mv<=0){fin=1;done(0)}}})}
function aim(){stop();$('gr').textContent='';
 let h=0,tm=30,lv=3,sz=58,ms=900,fin=0;$('ga').innerHTML='<div class="ar" id="ar"></div>';
 const r=$('ar'),up=()=>$('gs').textContent=`${t('gad')} | ⏱ ${tm} · ❤ ${lv} · ✔ ${h}`;
 const end=()=>{if(fin)return;fin=1;r.innerHTML='';done(h>=20?Math.floor(h/3):0)};
 const sp=()=>{clearTimeout(window.w);if(fin)return;r.innerHTML='';const bomb=Math.random()<.3,b=document.createElement('button');b.className='tg';
  b.style.cssText=`width:${sz}px;height:${sz}px;left:${Math.random()*(r.clientWidth-sz)}px;top:${Math.random()*(r.clientHeight-sz)}px`;b.textContent=bomb?'💣':'🎯';
  b.onclick=()=>{if(bomb)lv--;else{h++;sz=Math.max(26,sz-1.5);ms=Math.max(420,ms-18)}up();lv<=0?end():sp()};r.appendChild(b);
  window.w=setTimeout(()=>{if(!bomb){lv--;up();if(lv<=0)return end()}sp()},ms)};
 up();sp();window.tmr=setInterval(()=>{tm--;up();if(tm<=0)end()},1000)}
function simon(){stop();$('gr').textContent='';
 const C=['#ef4444','#22c55e','#3b82f6','#eab308'];let seq=[],i=0,busy=1,done_=0;
 $('ga').innerHTML=`<div class="gr2">${C.map((c,k)=>`<button class="pad" data-k="${k}" style="background:${c};color:${c}"></button>`).join('')}</div>`;
 const P=[...document.querySelectorAll('.pad')],sl=ms=>new Promise(r=>setTimeout(r,ms)),fl=async(k,ms)=>{P[k].classList.add('lit');await sl(ms);P[k].classList.remove('lit');await sl(110)};
 const st=()=>$('gs').textContent=`${t('gqd')} | 🎹 ${seq.length}`;
 const nx=async()=>{busy=1;seq.push(Math.random()*4|0);i=0;st();await sl(600);for(const k of seq)await fl(k,Math.max(150,450-seq.length*28));busy=0};
 P.forEach(p=>p.onclick=()=>{if(busy||done_)return;const k=+p.dataset.k;fl(k,140);
  if(k!=seq[i]){busy=1;done_=1;const r=seq.length-1;done(r>=5?(r-4)*4:0);return}
  i++;if(i==seq.length){busy=1;setTimeout(nx,500)}});
 nx()}

/* ---------- Services, Payment & Info ---------- */
function srv(){return [1,2,3].map(i=>`<div class="sv"><h3>${t('sv'+i)}</h3><p style="color:var(--mu)">${t('sv'+i+'d')}</p><div class="row s"><button class="btn" onclick="window.open('https://wa.me/${WA}?text='+encodeURIComponent('${T['sv'+i][0]}'))">${t('ask')}</button></div></div>`).join('')}
function payTab(){const c={FIB:'#0d8bd6',FASTPAY:'#e11d48',QCARD:'#f59e0b',ASIAPAY:'#dc2626'};
 return `<div class="box"><h2>${t('np')}</h2><div class="pm">${Object.keys(PAYN).map(k=>`<div class="pi" style="background:${c[k]}">${k}${PAYN[k]?`<div style="font-size:.9rem;margin-top:6px">${PAYN[k]}</div>`:''}</div>`).join('')}</div><div class="nt">${t('pmd')}</div></div>`}
function info(){const a=(h,n)=>`<a class="btn g" style="text-decoration:none" target="_blank" href="${h}">${n}</a>`;
 return `<div class="box"><h3>${t('ab')}</h3><p>${t('abd')}</p></div>
 <div class="box" style="margin-top:12px"><h3>${t('tc')}</h3><p>${t('tcd')}</p></div>
 <div class="box" style="margin-top:12px"><h3>${t('fq')}</h3><div class="qa"><b>${t('q1')}</b>${t('a1')}</div><div class="qa"><b>${t('q2')}</b>${t('a2')}</div></div>
 <div class="row s"><button class="btn" onclick="window.open('https://wa.me/${WA}?text='+encodeURIComponent('سڵاو کورد ئەجێنسی، دەمەوێت CVی خۆم بنێرم بۆ داواکاری کار.'))">${t('cv')}</button>
 ${a('https://www.tiktok.com/@kurd.agency','TikTok')}${a('https://www.facebook.com/share/1CAmPqe2Pj/','Facebook')}${a('https://www.instagram.com/aryann.tech','Instagram')}${a('https://snapchat.com/t/54mPJKNh','Snapchat')}</div>
 `}

$('hl').src=LOGO;document.querySelector('link[rel=icon]').href=ICON;
if(localStorage.kt=='light'){document.documentElement.dataset.theme='light';$('th').textContent='🌙'}
render();
</script>
