<!DOCTYPE html>
<html lang="ku" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kurd Face Studio - Powered by Kurd Agency</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.8/vision_bundle.js" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@300;400;600;700&family=Cairo:wght@400;600;700&family=Tajawal:wght@400;500;700&family=Changa:wght@400;600;700&family=Lalezar&family=Reem+Kufi:wght@500;700&family=Almarai:wght@400;700&family=Roboto:wght@400;500;700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cssgram/0.1.10/cssgram.min.css">
    
    <style>
        body { font-family: 'Noto Kufi Arabic', sans-serif; transition: background-color 0.3s, color 0.3s; user-select: none; overflow: hidden; height: 100vh; }
        .dark body { background-color: #08090c; color: #f3f4f6; }
        .light body { background-color: #f8fafc; color: #0f172a; }
        
        .workspace-grid { background-image: radial-gradient(#1e293b 1px, transparent 1px); background-size: 20px 20px; }
        .light .workspace-grid { background-image: radial-gradient(#cbd5e1 1px, transparent 1px); }

        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 18px; width: 18px; border-radius: 50%; background: #f59e0b; cursor: pointer; margin-top: -7px; box-shadow: 0 0 10px rgba(245, 158, 11, 0.8); }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; background: #1e293b; border-radius: 2px; }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        #faceMeshWrapper { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
        .effect-overlay-layer { position: absolute; inset: 0; pointer-events: none; opacity: 0; z-index: 25; transition: all 0.3s ease; }
        
        .mockup-phone { border: 12px solid #1e293b; border-radius: 36px; padding: 4px; background: #000; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); }

        #beforeAfterContainer { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; display: none; z-index: 45; }
        #beforeImage { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; z-index: 1; clip-path: inset(0 50% 0 0); filter: brightness(0.8); }
        #sliderHandle { position: absolute; top: 0; bottom: 0; left: 50%; width: 4px; background: #f59e0b; cursor: ew-resize; z-index: 2; pointer-events: auto; transform: translateX(-50%); box-shadow: 0 0 10px #000; }

        .safe-zone { position: absolute; inset: 0; border: 3px dashed #ef4444; pointer-events: none; display: none; z-index: 48; opacity: 0.8; }
        
        /* Magic Eraser Canvas */
        #eraserCanvas { position: absolute; top:0; left:0; pointer-events:none; z-index: 50; }
        
        /* Cropper Container */
        #cropModal { display: none; position: fixed; inset:0; background: rgba(0,0,0,0.9); z-index: 100; flex-direction: column; align-items: center; justify-content: center; }
        #cropImageHolder { max-width: 80%; max-height: 70vh; }
    </style>
</head>
<body class="flex flex-col">

    <div id="progressPercentageModal" class="fixed inset-0 bg-black/80 z-[90] hidden flex flex-col items-center justify-center">
        <div class="bg-[#11131e] border border-slate-800 p-8 rounded-2xl text-center max-w-xs w-full shadow-2xl">
            <div class="w-16 h-16 rounded-full border-4 border-amber-500/20 border-t-amber-500 animate-spin mx-auto mb-4"></div>
            <h3 class="text-sm font-bold text-white mb-1">پڕۆسەی زیرەکی دەستکرد</h3>
            <p id="progressStatusText" class="text-[11px] text-slate-400 mb-4">تکایە چاوەڕێبە...</p>
        </div>
    </div>

    <div id="cropModal" class="flex-col">
        <div class="w-full bg-slate-900 p-4 text-center text-white font-bold mb-4">بڕینی وێنە (Cropper)</div>
        <div><img id="cropImageHolder" src=""></div>
        <div class="mt-6 flex gap-4">
            <button onclick="applyCrop()" class="bg-emerald-500 px-6 py-2 rounded-lg font-bold text-black">بڕین ✂️</button>
            <button onclick="cancelCrop()" class="bg-red-500 px-6 py-2 rounded-lg font-bold text-white">پاشگەزبوونەوە ✖️</button>
        </div>
    </div>

    <header class="bg-[#0f111a] border-b border-slate-800 px-6 py-4 flex justify-between items-center shrink-0 z-50 shadow-lg">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-amber-500 to-yellow-400 flex items-center justify-center font-bold text-black text-xl shadow-lg">KF</div>
            <div>
                <h1 class="text-md font-bold tracking-wide" id="mainAppTitle">Kurd Face Studio</h1>
                <p class="text-[10px] text-amber-500 font-medium" id="mainAppSubtitle">دروستکراوە لە لایەن ئاریان علی : کورد ئەجێنسی</p>
            </div>
        </div>
        
        <div class="flex items-center gap-3 flex-wrap">
            <select id="langSelect" onchange="changeAppLanguage(this.value)" class="bg-slate-900 border border-slate-800 text-xs px-2.5 py-1.5 rounded-lg text-white outline-none">
                <option value="ku">کوردی</option>
                <option value="ar">العربية</option>
                <option value="en">English</option>
            </select>
            <button onclick="toggleLightDarkModeSystem()" class="p-2 bg-slate-900 border border-slate-800 rounded-lg text-xs text-amber-500">🌓</button>
            <label class="bg-amber-500 hover:bg-amber-600 text-black text-xs font-bold px-4 py-2.5 rounded-lg cursor-pointer transition flex items-center gap-2 shadow-md">
                <span id="lblUploadPhoto">بارکردنی وێنە 📁</span>
                <input type="file" id="imageLoader" accept="image/*" class="hidden" onchange="loadUserPhoto(event)">
            </label>
        </div>
    </header>

    <main class="flex-1 flex flex-col lg:flex-row overflow-hidden">
        <div class="flex-1 workspace-grid flex flex-col items-center justify-center p-6 relative overflow-hidden h-full">
            <div class="absolute top-4 left-4 right-4 flex justify-between items-center z-40 pointer-events-none">
                <div class="flex gap-2 pointer-events-auto">
                    <button onclick="executeUndoStep()" class="bg-slate-900 border border-slate-800 px-3 py-1.5 rounded-lg text-xs text-white hover:border-amber-500 transition">↩️ گەڕانەوە</button>
                    <button onclick="executeRedoStep()" class="bg-slate-900 border border-slate-800 px-3 py-1.5 rounded-lg text-xs text-white hover:border-amber-500 transition">↪️ پێشەوە</button>
                </div>
                <div class="flex gap-2 pointer-events-auto">
                    <button onclick="toggleBeforeAfterCurtain()" class="bg-slate-900 border border-slate-800 px-3 py-1.5 rounded-lg text-xs text-amber-500 font-bold transition">↔️ پێش و پاش</button>
                </div>
            </div>

            <div id="mockupFrameContainer" class="transition-all duration-300 flex items-center justify-center" style="width: 540px; height: 85%;">
                <div id="canvasViewport" class="relative w-full h-full rounded-2xl shadow-2xl overflow-hidden flex items-center justify-center bg-[#090b11] border border-slate-800/50">
                    <div id="faceMeshWrapper">
                        <canvas id="baseImageCanvas" class="max-w-full max-h-full object-contain"></canvas>
                        <img id="targetImage" style="display:none;" crossorigin="anonymous"> <canvas id="makeupCanvas" class="absolute inset-0 w-full h-full pointer-events-none z-30" style="mix-blend-mode: multiply; opacity: 0.8;"></canvas>
                        
                        <div class="absolute inset-0 z-40 pointer-events-none" id="fabricWrapper">
                            <canvas id="fabricCanvas"></canvas>
                        </div>
                        
                        <canvas id="eraserCanvas" class="absolute inset-0 w-full h-full opacity-50 z-50"></canvas>

                        <div id="beforeAfterContainer">
                            <img id="beforeImage" src="" class="max-w-full max-h-full object-contain select-none">
                            <div id="sliderHandle"></div>
                        </div>

                        <div id="safeZoneOverlay" class="safe-zone">
                            <div id="safeZoneLabel" class="absolute bottom-20 left-4 right-16 text-[10px] bg-black/80 p-2 rounded text-left font-mono text-white">TikTok Verified Safe Zone</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="w-full lg:w-[460px] bg-[#0c0d14] border-t lg:border-t-0 lg:border-r border-slate-800 flex flex-col h-[55%] lg:h-full shrink-0 shadow-2xl z-50">
            <div class="flex flex-wrap bg-[#0f111a] border-b border-slate-800 p-3 gap-2 shrink-0">
                <button onclick="switchStudioCategory('face', this)" class="cat-btn bg-amber-500 text-black px-3 py-2 rounded-xl text-xs font-bold transition">👤 دەموچاو</button>
                <button onclick="switchStudioCategory('makeup', this)" class="cat-btn text-slate-400 hover:text-white px-3 py-2 rounded-xl text-xs font-semibold transition">💄 مەیک ئەپ</button>
                <button onclick="switchStudioCategory('filters', this)" class="cat-btn text-slate-400 hover:text-white px-3 py-2 rounded-xl text-xs font-semibold transition">🎬 فلتەر</button>
                <button onclick="switchStudioCategory('text', this)" class="cat-btn text-slate-400 hover:text-white px-3 py-2 rounded-xl text-xs font-semibold transition">📝 تێکست</button>
                <button onclick="switchStudioCategory('ai', this)" class="cat-btn text-amber-500 hover:bg-amber-500/10 px-3 py-2 rounded-xl text-xs font-bold transition">🤖 AI</button>
                <button onclick="switchStudioCategory('export', this)" class="cat-btn text-emerald-400 hover:bg-emerald-500/10 px-3 py-2 rounded-xl text-xs font-bold transition">💾 سەیڤ</button>
            </div>

            <div id="controlsConsoleArea" class="flex-1 overflow-y-auto p-4 space-y-4 no-scrollbar bg-[#0c0d14]">
                </div>
            
            <div class="p-3 bg-[#090a0f] text-center border-t border-slate-800/80 text-[11px] text-slate-500 font-bold">
                دروستکراوە لە لایەن ئاریان علی : کورد ئەجێنسی
            </div>
        </div>
    </main>

    <script>
        // --- 1. State & Setup ---
        const state = {
            lang: 'ku', category: 'face', color: '#dc2626',
            eraserActive: false, cropperInstance: null, fabricInstance: null,
            history: [], historyIndex: -1, faceLandmarks: null,
            filters: ['_1977', 'aden', 'brannan', 'brooklyn', 'clarendon', 'earlybird', 'gingham', 'hudson', 'inkwell', 'kelvin', 'lark', 'lofi']
        };

        const dict = {
            ku: { crop: 'بڕینی وێنە', removeBg: 'لابردنی باکگراوند (API)', save: 'سەیڤکردن' },
            ar: { crop: 'قص الصورة', removeBg: 'إزالة الخلفية', save: 'حفظ' },
            en: { crop: 'Crop Image', removeBg: 'Remove BG (API)', save: 'Save Image' }
        };

        document.addEventListener('DOMContentLoaded', async () => {
            initFabricJS();
            initEraser();
            initSlider();
            await loadMediapipe();
            switchStudioCategory('face', document.querySelector('.cat-btn')); // Load initial tab
        });

        // --- 2. Mediapipe (Real AI Makeup) ---
        let faceLandmarker;
        async function loadMediapipe() {
            try {
                const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm");
                faceLandmarker = await FaceLandmarker.createFromOptions(vision, {
                    baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task" },
                    runningMode: "IMAGE", numFaces: 1
                });
                console.log("Mediapipe Ready ✅");
            } catch (e) { console.error("Mediapipe Error:", e); }
        }

        async function processMakeup() {
            const img = document.getElementById('targetImage');
            const canvas = document.getElementById('makeupCanvas');
            const ctx = canvas.getContext('2d');
            
            if(!faceLandmarker || !img.complete || img.naturalWidth === 0) return;
            
            canvas.width = img.clientWidth;
            canvas.height = img.clientHeight;
            ctx.clearRect(0,0, canvas.width, canvas.height);

            const results = await faceLandmarker.detect(img);
            if (results.faceLandmarks && results.faceLandmarks.length > 0) {
                const landmarks = results.faceLandmarks[0];
                // Lips precise indices mapping
                const lipsOuter = [61, 185, 40, 39, 37, 0, 267, 269, 270, 409, 291, 375, 321, 405, 314, 17, 84, 181, 91, 146];
                
                ctx.beginPath();
                lipsOuter.forEach((idx, i) => {
                    const pt = landmarks[idx];
                    const x = pt.x * canvas.width;
                    const y = pt.y * canvas.height;
                    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
                });
                ctx.closePath();
                ctx.fillStyle = state.color;
                ctx.fill();
            }
        }

        // --- 3. Image Loading & Saving to Canvas ---
        function loadUserPhoto(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (evt) => {
                const img = document.getElementById('targetImage');
                img.onload = () => {
                    const canvas = document.getElementById('baseImageCanvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = img.naturalWidth;
                    canvas.height = img.naturalHeight;
                    ctx.drawImage(img, 0, 0);
                    
                    // Resize Fabric and AI canvas
                    state.fabricInstance.setWidth(img.clientWidth);
                    state.fabricInstance.setHeight(img.clientHeight);
                    
                    saveToHistory();
                    processMakeup();
                };
                img.src = evt.target.result;
            };
            reader.readAsDataURL(file);
        }

        // --- 4. Remove BG (API Integration) ---
        async function removeBackgroundAPI() {
            const canvas = document.getElementById('baseImageCanvas');
            const dataUrl = canvas.toDataURL('image/png');
            const blob = await (await fetch(dataUrl)).blob();
            
            const modal = document.getElementById('progressPercentageModal');
            modal.classList.remove('hidden');

            const formData = new FormData();
            formData.append('size', 'auto');
            formData.append('image_file', blob);

            try {
                // YOUR API KEY: He4tD6ufmQfs7od8WzjcLqFH
                const res = await fetch('https://api.remove.bg/v1.0/removebg', {
                    method: 'POST',
                    headers: { 'X-Api-Key': 'He4tD6ufmQfs7od8WzjcLqFH' },
                    body: formData
                });
                
                if(res.ok) {
                    const resBlob = await res.blob();
                    const newImg = new Image();
                    newImg.onload = () => {
                        const ctx = canvas.getContext('2d');
                        ctx.clearRect(0,0, canvas.width, canvas.height);
                        ctx.drawImage(newImg, 0, 0, canvas.width, canvas.height);
                        saveToHistory();
                        modal.classList.add('hidden');
                    };
                    newImg.src = URL.createObjectURL(resBlob);
                } else {
                    alert('هەڵە ڕوویدا لە سڕینەوەی باکگراوند. دڵنیابە باڵانسی API ماوە.');
                    modal.classList.add('hidden');
                }
            } catch(e) {
                console.error(e);
                modal.classList.add('hidden');
                alert('کێشە لە هێڵی ئینتەرنێت هەیە.');
            }
        }

        // --- 5. Magic Eraser (Client-side Canvas Erase) ---
        function initEraser() {
            const eCanvas = document.getElementById('eraserCanvas');
            const ctx = eCanvas.getContext('2d');
            let drawing = false;

            eCanvas.addEventListener('mousedown', () => drawing = true);
            eCanvas.addEventListener('mouseup', () => {
                drawing = false; ctx.beginPath();
                applyEraserToBaseCanvas(); // Commit changes
            });
            eCanvas.addEventListener('mousemove', (e) => {
                if(!drawing || !state.eraserActive) return;
                const rect = eCanvas.getBoundingClientRect();
                ctx.lineWidth = 30; ctx.lineCap = 'round';
                ctx.strokeStyle = 'rgba(255,0,0,0.5)'; // visual red trace
                ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
            });
        }

        function toggleEraser() {
            state.eraserActive = !state.eraserActive;
            const eCanvas = document.getElementById('eraserCanvas');
            if(state.eraserActive) {
                const bCanvas = document.getElementById('baseImageCanvas');
                eCanvas.width = bCanvas.clientWidth;
                eCanvas.height = bCanvas.clientHeight;
                eCanvas.style.pointerEvents = 'auto';
                alert('سڕینەوەی دەستی چالاک کرا! پەنجە بەو شوێنانەدا بهێنە کە دەتەوێت بیسڕیتەوە.');
            } else {
                eCanvas.style.pointerEvents = 'none';
            }
        }

        function applyEraserToBaseCanvas() {
            const eCanvas = document.getElementById('eraserCanvas');
            const bCanvas = document.getElementById('baseImageCanvas');
            const bCtx = bCanvas.getContext('2d');
            
            // Map the visual eraser stroke to the actual high-res canvas coordinates
            const scaleX = bCanvas.width / eCanvas.width;
            const scaleY = bCanvas.height / eCanvas.height;
            
            bCtx.globalCompositeOperation = 'destination-out';
            bCtx.drawImage(eCanvas, 0, 0, eCanvas.width, eCanvas.height, 0, 0, bCanvas.width, bCanvas.height);
            bCtx.globalCompositeOperation = 'source-over'; // Reset
            
            // Clear temporary eraser visual canvas
            eCanvas.getContext('2d').clearRect(0,0, eCanvas.width, eCanvas.height);
            saveToHistory();
        }

        // --- 6. UI Controls & Menus ---
        function switchStudioCategory(cat, btn) {
            document.querySelectorAll('.cat-btn').forEach(b => { b.classList.remove('bg-amber-500','text-black'); b.classList.add('text-slate-400'); });
            btn.classList.add('bg-amber-500','text-black');
            btn.classList.remove('text-slate-400');
            
            const panel = document.getElementById('controlsConsoleArea');
            panel.innerHTML = '';

            if(cat === 'ai') {
                panel.innerHTML = `
                    <div class="space-y-3">
                        <button onclick="removeBackgroundAPI()" class="w-full bg-gradient-to-r from-amber-500 to-yellow-500 text-black font-bold p-3 rounded-xl shadow-lg">✂️ لابردنی باکگراوند (Remove.bg API)</button>
                        <button onclick="toggleEraser()" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl text-white font-bold">🖌️ سڕینەوەی دەستی (Magic Eraser)</button>
                        <button onclick="openCropper()" class="w-full bg-blue-600 text-white font-bold p-3 rounded-xl shadow-lg">✂️ بڕینی وێنە (Crop)</button>
                    </div>
                    <hr class="border-slate-800 my-4">
                    <label class="text-xs text-slate-400 block mb-2">دانان لە چوارچێوە (Mockup)</label>
                    <select onchange="applyMockup(this.value)" class="w-full bg-slate-900 text-white p-2 rounded-xl outline-none">
                        <option value="none">ئاسایی</option>
                        <option value="phone">چوارچێوەی مۆبایل</option>
                    </select>
                    <label class="text-xs text-slate-400 block mt-4 mb-2">هێڵکاری سەلامەتی (Safe Zones)</label>
                    <select onchange="applySafeZone(this.value)" class="w-full bg-slate-900 text-white p-2 rounded-xl outline-none">
                        <option value="none">داخستن</option>
                        <option value="tiktok">سنووری تیکتۆک (TikTok Verified)</option>
                    </select>
                `;
            } 
            else if(cat === 'makeup') {
                panel.innerHTML = `
                    <div class="bg-amber-500/10 border border-amber-500/20 p-3 rounded-xl mb-4">
                        <h3 class="text-amber-500 text-xs font-bold mb-2">مەیک ئەپی ئۆتۆماتیکی (Mediapipe)</h3>
                        <p class="text-[10px] text-slate-400">ڕەنگێک هەڵبژێرە، بە شێوەیەکی زیرەک دەچێتە سەر خاڵی لێوەکان.</p>
                        <div class="grid grid-cols-6 gap-2 mt-3">
                            ${['#dc2626', '#be185d', '#9d174d', '#b91c1c', '#ea580c', '#000000'].map(c => `
                                <button onclick="state.color='${c}'; processMakeup();" class="w-8 h-8 rounded-full border-2 border-transparent hover:border-amber-500" style="background-color: ${c}"></button>
                            `).join('')}
                        </div>
                    </div>
                `;
            }
            else if(cat === 'filters') {
                let html = '<div class="grid grid-cols-3 gap-3">';
                state.filters.forEach(f => {
                    html += `<button onclick="applyCssFilter('${f}')" class="p-2 bg-slate-900 border border-slate-800 rounded-lg text-[10px] font-bold hover:border-amber-500 text-white">${f}</button>`;
                });
                html += '</div>';
                panel.innerHTML = html;
            }
            else if(cat === 'text') {
                panel.innerHTML = `
                    <button onclick="addTextLayer()" class="w-full bg-amber-500 text-black font-bold p-3 rounded-xl">➕ زیادکردنی تێکست (Fabric.js)</button>
                    <div class="mt-4 grid grid-cols-2 gap-2">
                        <button onclick="changeFont('Noto Kufi Arabic')" class="p-2 bg-slate-900 text-white text-xs rounded-lg">Kufi Arabic</button>
                        <button onclick="changeFont('Tajawal')" class="p-2 bg-slate-900 text-white text-xs rounded-lg">Tajawal</button>
                        <button onclick="changeFont('Lalezar')" class="p-2 bg-slate-900 text-white text-xs rounded-lg">Lalezar</button>
                    </div>
                `;
            }
            else if(cat === 'export') {
                panel.innerHTML = `
                    <button onclick="exportFinalCombinedImage()" class="w-full bg-emerald-500 text-black font-black p-4 rounded-xl shadow-lg text-sm">📥 سەیڤکردن بۆ مۆبایل / کۆمپیوتەر</button>
                `;
            }
        }

        // --- 7. Saving/Exporting (Combined Canvas) ---
        function exportFinalCombinedImage() {
            const baseCanvas = document.getElementById('baseImageCanvas');
            const makeupCanvas = document.getElementById('makeupCanvas');
            const fabricCanvas = document.getElementById('fabricCanvas');
            
            const exportCanvas = document.createElement('canvas');
            exportCanvas.width = baseCanvas.width;
            exportCanvas.height = baseCanvas.height;
            const ctx = exportCanvas.getContext('2d');

            // 1. Draw base image (with any applied CSSgram filter if possible, though CSSgram is DOM based. For true export, we redraw).
            ctx.filter = document.getElementById('canvasViewport').style.filter || 'none';
            ctx.drawImage(baseCanvas, 0, 0);
            ctx.filter = 'none';

            // 2. Draw Makeup (Scale up to high res)
            ctx.globalCompositeOperation = 'multiply';
            ctx.drawImage(makeupCanvas, 0, 0, makeupCanvas.width, makeupCanvas.height, 0, 0, exportCanvas.width, exportCanvas.height);
            ctx.globalCompositeOperation = 'source-over';

            // 3. Draw Fabric Text
            ctx.drawImage(fabricCanvas, 0, 0, fabricCanvas.width, fabricCanvas.height, 0, 0, exportCanvas.width, exportCanvas.height);

            // 4. Draw Watermark
            ctx.font = "bold 24px 'Noto Kufi Arabic'";
            ctx.fillStyle = "rgba(255, 255, 255, 0.6)";
            ctx.fillText("دروستکراوە لە لایەن ئاریان علی : کورد ئەجێنسی", 40, exportCanvas.height - 40);

            // Download
            const link = document.createElement('a');
            link.download = `KurdFaceStudio_Export_${Date.now()}.png`;
            link.href = exportCanvas.toDataURL('image/png');
            link.click();
        }

        // --- Helper Tools (Cropper, Fabric, Filters, History) ---
        function openCropper() {
            const canvas = document.getElementById('baseImageCanvas');
            document.getElementById('cropImageHolder').src = canvas.toDataURL();
            document.getElementById('cropModal').style.display = 'flex';
            if(state.cropperInstance) state.cropperInstance.destroy();
            state.cropperInstance = new Cropper(document.getElementById('cropImageHolder'), { viewMode: 1 });
        }
        function applyCrop() {
            const croppedCanvas = state.cropperInstance.getCroppedCanvas();
            const bCanvas = document.getElementById('baseImageCanvas');
            const bCtx = bCanvas.getContext('2d');
            bCanvas.width = croppedCanvas.width;
            bCanvas.height = croppedCanvas.height;
            bCtx.clearRect(0,0, bCanvas.width, bCanvas.height);
            bCtx.drawImage(croppedCanvas, 0, 0);
            
            document.getElementById('cropModal').style.display = 'none';
            state.cropperInstance.destroy();
            saveToHistory(); processMakeup();
        }
        function cancelCrop() { document.getElementById('cropModal').style.display = 'none'; state.cropperInstance.destroy(); }

        function initFabricJS() {
            state.fabricInstance = new fabric.Canvas('fabricCanvas', { preserveObjectStacking: true });
            document.getElementById('fabricWrapper').style.pointerEvents = 'auto'; // allow interaction
        }
        function addTextLayer() {
            const txt = new fabric.IText('کورد فەیس', { left: 100, top: 100, fontFamily: 'Noto Kufi Arabic', fill: '#ffffff', fontSize: 40, shadow: new fabric.Shadow({ color: 'rgba(0,0,0,0.8)', blur: 5 }) });
            state.fabricInstance.add(txt);
            state.fabricInstance.setActiveObject(txt);
        }
        function changeFont(font) {
            const obj = state.fabricInstance.getActiveObject();
            if(obj) { obj.set({ fontFamily: font }); state.fabricInstance.renderAll(); }
        }

        function applyCssFilter(filterName) {
            document.getElementById('canvasViewport').className = `relative w-full h-full rounded-2xl shadow-2xl overflow-hidden flex items-center justify-center bg-[#090b11] border border-slate-800/50 ${filterName}`;
        }

        function applyMockup(val) { document.getElementById('mockupFrameContainer').className = val === 'phone' ? 'mockup-phone transition-all duration-300 flex items-center justify-center' : 'transition-all duration-300 flex items-center justify-center'; }
        function applySafeZone(val) { document.getElementById('safeZoneOverlay').style.display = val === 'tiktok' ? 'block' : 'none'; }

        function saveToHistory() {
            const canvas = document.getElementById('baseImageCanvas');
            state.history.push(canvas.toDataURL());
            state.historyIndex++;
        }
        function executeUndoStep() {
            if(state.historyIndex > 0) {
                state.historyIndex--;
                restoreCanvas(state.history[state.historyIndex]);
            }
        }
        function restoreCanvas(dataUrl) {
            const img = new Image();
            img.onload = () => {
                const canvas = document.getElementById('baseImageCanvas');
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0,0,canvas.width, canvas.height);
                ctx.drawImage(img,0,0);
                processMakeup();
            };
            img.src = dataUrl;
        }

        // Before/After Slider init
        function initSlider() {
            const handle = document.getElementById('sliderHandle');
            const beforeImg = document.getElementById('beforeImage');
            let dragging = false;
            handle.addEventListener('mousedown', () => dragging = true);
            document.addEventListener('mouseup', () => dragging = false);
            document.addEventListener('mousemove', (e) => {
                if(!dragging) return;
                const bounds = document.getElementById('canvasViewport').getBoundingClientRect();
                let pct = ((e.clientX - bounds.left) / bounds.width) * 100;
                handle.style.left = `${pct}%`;
                beforeImg.style.clipPath = `inset(0 ${100 - pct}% 0 0)`;
            });
        }
        function toggleBeforeAfterCurtain() {
            const container = document.getElementById('beforeAfterContainer');
            if(container.style.display === 'block') { container.style.display = 'none'; } 
            else { document.getElementById('beforeImage').src = state.history[0]; container.style.display = 'block'; }
        }

        function toggleLightDarkModeSystem() { document.documentElement.classList.toggle('dark'); document.documentElement.classList.toggle('light'); }
    </script>
</body>
</html>
