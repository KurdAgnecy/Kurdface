<!DOCTYPE html>
<html lang="ku" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kurd Face Studio - Powered by Kurd Agency</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: {} }
        }
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@300;400;600;700&family=Cairo:wght@400;600;700&family=Tajawal:wght@400;500;700&family=Changa:wght@400;600;700&family=Lalezar&family=Reem+Kufi:wght@500;700&family=Amiri:ital@0;1&family=Almarai:wght@400;700&family=El+Messiri:wght@500;700&family=Roboto:wght@400;500;700&family=Montserrat:wght@400;600;700&family=Oswald:wght@400;600&family=Playfair+Display:ital,wght@0,600;1,400&family=Poppins:wght@400;600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Noto Kufi Arabic', sans-serif; user-select: none; overflow: hidden; height: 100vh; transition: background-color 0.3s, color 0.3s; }
        
        /* Dark/Light Mode Variables */
        .dark body { background-color: #08090c; color: #f3f4f6; }
        html:not(.dark) body { background-color: #f8fafc; color: #1e293b; }
        
        .dark .workspace-grid { background-image: radial-gradient(#1e293b 1px, transparent 1px); background-size: 20px 20px; }
        html:not(.dark) .workspace-grid { background-image: radial-gradient(#cbd5e1 1px, transparent 1px); background-size: 20px 20px; background-color: #e2e8f0; }

        .dark .panel-bg { background-color: #0c0d14; border-color: #1e293b; }
        html:not(.dark) .panel-bg { background-color: #ffffff; border-color: #e2e8f0; }

        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 18px; width: 18px; border-radius: 50%; background: #f59e0b; cursor: pointer; margin-top: -7px; box-shadow: 0 0 10px rgba(245, 158, 11, 0.8); }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; background: #94a3b8; border-radius: 2px; }
        .dark input[type=range]::-webkit-slider-runnable-track { background: #1e293b; }
        .no-scrollbar::-webkit-scrollbar { display: none; }

        #faceMeshWrapper { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
        .effect-overlay-layer { position: absolute; inset: 0; pointer-events: none; opacity: 0; z-index: 25; transition: all 0.3s ease; }
        
        .draggable-text-node { position: absolute; top: 35%; left: 50%; transform: translate(-50%, -50%); cursor: move; white-space: pre-wrap; text-align: center; z-index: 50; padding: 6px; border: 1px dashed transparent; transition: border-color 0.2s; }
        .draggable-text-node:hover { border-color: #f59e0b; }
        
        /* Mediapipe Canvas */
        #makeupCanvas { position: absolute; pointer-events: none; z-index: 20; }
    </style>
</head>
<body class="flex flex-col">

    <div id="globalProgressBar" class="fixed top-0 left-0 right-0 h-1.5 bg-amber-500/10 z-[100] hidden">
        <div id="progressFillInner" class="h-full bg-gradient-to-r from-amber-500 to-yellow-400 w-0 transition-all duration-100 ease-out"></div>
    </div>
    
    <div id="progressPercentageModal" class="fixed inset-0 bg-black/80 z-[90] hidden flex flex-col items-center justify-center">
        <div class="bg-[#11131e] border border-slate-800 p-8 rounded-2xl text-center max-w-xs w-full shadow-2xl">
            <div class="w-16 h-16 rounded-full border-4 border-amber-500/20 border-t-amber-500 animate-spin mx-auto mb-4"></div>
            <h3 class="text-sm font-bold text-white mb-1" id="ui-loading-title">پڕۆسەی زیرەکی دەستکرد</h3>
            <p id="progressStatusText" class="text-[11px] text-slate-400 mb-4">لابردنی پاشبنەما (Remove BG)...</p>
            <div class="text-3xl font-black text-amber-500 font-mono" id="numericPercentageDisplay">0%</div>
        </div>
    </div>

    <header class="panel-bg border-b px-6 py-4 flex justify-between items-center shrink-0 z-50 shadow-lg">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-amber-500 to-yellow-400 flex items-center justify-center font-bold text-black text-xl shadow-lg shadow-amber-500/20">KF</div>
            <div>
                <h1 class="text-md font-bold tracking-wide dark:text-white text-slate-900" id="ui-app-title">Kurd Face Studio</h1>
                <p class="text-[10px] text-amber-500 font-medium">دروستکراوە لە لایەن ئاریان علی : کورد ئەجێنسی</p>
            </div>
        </div>
        
        <div class="flex items-center gap-2 lg:gap-3">
            <select id="langSwitcher" onchange="changeLanguage(this.value)" class="bg-slate-800 text-xs text-white p-2 rounded-lg outline-none border border-slate-700 hidden lg:block">
                <option value="ku">کوردی</option>
                <option value="ar">العربية</option>
                <option value="en">English</option>
            </select>

            <button onclick="toggleTheme()" class="p-2 rounded-lg bg-slate-800 text-white text-xs border border-slate-700" id="themeBtn">🌙</button>

            <button onclick="undoAction()" class="p-2 rounded-lg bg-slate-800 text-white text-xs border border-slate-700 hover:bg-slate-700 transition" title="گەڕانەوە">↩</button>
            <button onclick="redoAction()" class="p-2 rounded-lg bg-slate-800 text-white text-xs border border-slate-700 hover:bg-slate-700 transition" title="چوونە پێش">↪</button>

            <div class="hidden lg:flex bg-slate-900 p-1 rounded-lg border border-slate-800 text-xs">
                <button onclick="loadSampleModel('female')" class="px-3 py-1.5 rounded-md hover:text-white transition text-amber-500 font-bold" id="ui-sample-girl">کچ (نموونە) 👩‍🦰</button>
                <button onclick="loadSampleModel('male')" class="px-3 py-1.5 rounded-md hover:text-white transition text-slate-400 font-bold" id="ui-sample-boy">کوڕ (نموونە) 👨‍🦱</button>
            </div>
            
            <label class="bg-slate-800 hover:bg-slate-700 text-white text-xs font-bold px-3 py-2.5 rounded-lg cursor-pointer transition shadow-md border border-slate-700 flex items-center gap-2">
                <span id="ui-upload">بارکردن 📁</span>
                <input type="file" id="imageLoader" accept="image/*" class="hidden" onchange="loadUserPhoto(event)">
            </label>

            <button onclick="downloadFinalImage()" class="bg-amber-500 hover:bg-amber-600 text-black text-xs font-bold px-4 py-2.5 rounded-lg cursor-pointer transition flex items-center gap-2 shadow-md">
                <span id="ui-save">سەیڤکردن 💾</span>
            </button>
        </div>
    </header>

    <main class="flex-1 flex flex-col lg:flex-row overflow-hidden">
        
        <div class="flex-1 workspace-grid flex items-center justify-center p-6 relative overflow-hidden h-full">
            <div id="canvasViewport" class="relative max-w-full max-h-full rounded-2xl shadow-2xl overflow-hidden flex items-center justify-center panel-bg" style="width: 480px; height: 85%;">
                
                <div id="faceMeshWrapper">
                    <img id="targetImage" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=800&auto=format&fit=crop" class="max-w-full max-h-full object-contain select-none transition-all duration-150 origin-center crossOrigin="anonymous"">
                    
                    <canvas id="makeupCanvas" class="absolute inset-0 w-full h-full"></canvas>

                    <div id="sunlightEffectLayer" class="effect-overlay-layer mix-blend-overlay"></div>
                    <div id="butterflyEffectLayer" class="effect-overlay-layer mix-blend-screen bg-contain bg-no-repeat bg-center"></div>
                    <div id="bodyMuscleLayer" class="effect-overlay-layer mix-blend-hard-light" style="background: radial-gradient(circle at 50% 80%, rgba(0,0,0,0.45) 0%, transparent 40%);"></div>
                    
                    <div id="globalTextNode" class="draggable-text-node font-bold" style="font-size: 32px; color: #ffffff;">کورد فەیس</div>
                </div>
                
                <canvas id="maskCanvas" class="absolute inset-0 w-full h-full pointer-events-none z-40"></canvas>
            </div>
        </div>

        <div class="w-full lg:w-[460px] panel-bg border-t lg:border-t-0 lg:border-r flex flex-col h-[52%] lg:h-full shrink-0 shadow-2xl">
            
            <div class="flex overflow-x-auto panel-bg border-b p-3 gap-2 no-scrollbar shrink-0" id="mainCategories">
                <button onclick="switchStudioCategory('face', this)" class="cat-btn bg-amber-500 text-black px-4 py-2.5 rounded-xl text-xs font-bold transition flex items-center gap-1.5 shrink-0">👤 دەموچاو</button>
                <button onclick="switchStudioCategory('makeup', this)" class="cat-btn text-slate-500 dark:text-slate-400 hover:text-amber-500 px-4 py-2.5 rounded-xl text-xs font-semibold transition flex items-center gap-1.5 shrink-0">💄 مەیک ئەپ</button>
                <button onclick="switchStudioCategory('body', this)" class="cat-btn text-slate-500 dark:text-slate-400 hover:text-amber-500 px-4 py-2.5 rounded-xl text-xs font-semibold transition flex items-center gap-1.5 shrink-0">💪 جەستە</button>
                <button onclick="switchStudioCategory('filters', this)" class="cat-btn text-slate-500 dark:text-slate-400 hover:text-amber-500 px-4 py-2.5 rounded-xl text-xs font-semibold transition flex items-center gap-1.5 shrink-0">🎬 فلتەرەکان</button>
                <button onclick="switchStudioCategory('effects', this)" class="cat-btn text-slate-500 dark:text-slate-400 hover:text-amber-500 px-4 py-2.5 rounded-xl text-xs font-semibold transition flex items-center gap-1.5 shrink-0">✨ ئیفێکتەکان</button>
                <button onclick="switchStudioCategory('text', this)" class="cat-btn text-slate-500 dark:text-slate-400 hover:text-amber-500 px-4 py-2.5 rounded-xl text-xs font-semibold transition flex items-center gap-1.5 shrink-0">📝 تێکست</button>
                <button onclick="switchStudioCategory('ai', this)" class="cat-btn text-amber-500 px-4 py-2.5 rounded-xl text-xs font-bold transition flex items-center gap-1.5 shrink-0">🤖 هۆشی دەستکرد</button>
            </div>

            <div id="subCategoryContextArea" class="flex overflow-x-auto panel-bg border-b p-2.5 gap-2 no-scrollbar shrink-0"></div>

            <div id="controlsConsoleArea" class="flex-1 overflow-y-auto p-4 space-y-4 no-scrollbar panel-bg"></div>
            
        </div>
    </main>

    <script>
        // --- 1. State & Dictionaries ---
        const appEngineState = {
            activeCategory: 'face', activeSubTab: 'shape',
            eraserActive: false, currentHexColor: '#dc2626', textContent: 'کورد فەیس',
            landmarks: null, // Mediapipe points
            history: { past: [], future: [] }, // Undo/Redo Storage
            sliders: {
                shape: { slim: { label: 'باریککردنی شێوە', val: 0, min: -15, max: 15, unit: '%' }, width: { label: 'پانی دەموچاو', val: 0, min: -20, max: 20, unit: '%' }, vshape: { label: 'شێوەی ڤی', val: 0, min: 0, max: 20, unit: '%' } },
                eyebrows: { thickness: { label: 'ئەستووری برۆ', val: 0, min: -10, max: 10, unit: 'px' }, lift: { label: 'بەرزکردنەوەی برۆ', val: 0, min: -15, max: 15, unit: 'px' } },
                eyes: { size: { label: 'قەبارەی چاوەکان', val: 100, min: 80, max: 125, unit: '%' }, height: { label: 'بڵندایی چاو', val: 100, min: 90, max: 115, unit: '%' } },
                nose: { size: { label: 'قەبارەی لوت', val: 100, min: 80, max: 120, unit: '%' }, width: { label: 'پانی لوت', val: 100, min: 80, max: 120, unit: '%' } },
                mouth: { size: { label: 'قەبارەی دەم', val: 100, min: 85, max: 120, unit: '%' }, smile: { label: 'پێکەنین', val: 0, min: -10, max: 20, unit: 'px' } },
                lipstick: { intensity: { label: 'خەستی سووراو', val: 0, min: 0, max: 100, unit: '%' } },
                blush: { intensity: { label: 'خەستی ڕوومەتگەشێن', val: 0, min: 0, max: 100, unit: '%' } },
                bodyManual: { scaleX: { label: 'پانی ڕێکخستنی دەستی', val: 100, min: 80, max: 120, unit: '%' } },
                bodyAuto: { slimming: { label: 'باریککردنی زیرەک', val: 0, min: 0, max: 35, unit: '%' } },
                bodyMuscle: { definition: { label: 'هێڵی ماسولکەکان', val: 0, min: 0, max: 100, unit: '%' } }
            }
        };

        const hierarchyConfig = {
            face: [{ id: 'shape', label: 'شێوە', icon: '📐' }, { id: 'eyebrows', label: 'برۆکان', icon: '〰️' }, { id: 'eyes', label: 'چاوەکان', icon: '👁️' }, { id: 'nose', label: 'لوت', icon: '👃' }, { id: 'mouth', label: 'دەم', icon: '👄' }],
            makeup: [{ id: 'presets', label: 'ئامادەکراو', icon: '✨' }, { id: 'lipstick', label: 'سووراو', icon: '💄' }, { id: 'blush', label: 'ڕوومەتگەشێن', icon: '🌸' }],
            body: [{ id: 'bodyManual', label: 'دەستی', icon: '✋' }, { id: 'bodyAuto', label: 'ئۆتۆ', icon: '✨' }, { id: 'bodyMuscle', label: 'ماسولکە', icon: '💪' }],
            filters: null,
            effects: [{ id: 'sunlightSub', label: 'خۆر', icon: '☀️' }, { id: 'butterflySub', label: 'پەپوولە', icon: '🦋' }],
            text: [{ id: 'textAdd', label: 'نووسین', icon: '➕' }, { id: 'textStyle', label: 'ستایل', icon: '🎨' }, { id: 'textBlend', label: 'تێکەڵکردن', icon: '🌀' }],
            ai: null
        };

        const fontLibrary = [{ id: 'Noto Kufi Arabic', name: 'Noto Kufi (کوردی/عەرەبی)' }, { id: 'Cairo', name: 'Cairo Font' }, { id: 'Tajawal', name: 'Tajawal' }, { id: 'Roboto', name: 'Roboto (English)' }];
        const extensiveFiltersList = [{ id: 'none', label: 'ئاسایی' }, { id: 'basis', label: 'Basis Beauty 🌸', matrix: 'contrast(1.15) brightness(1.03) saturate(1.12)' }, { id: 'clear', label: 'Clear Face ✨', matrix: 'brightness(1.10) contrast(1.04) saturate(0.92)' }, { id: 'retro', label: 'Retro 80s 🕹️', matrix: 'contrast(1.2) sepia(0.25) saturate(1.5)' }];

        // --- 2. Mediapipe AI Face Mesh Logic (The Fix for Lips/Brows) ---
        const faceMesh = new FaceMesh({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}` });
        faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: true, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
        
        faceMesh.onResults((results) => {
            appEngineState.landmarks = results.multiFaceLandmarks ? results.multiFaceLandmarks[0] : null;
            drawMakeupOnCanvas();
        });

        async function processImageForAI() {
            const img = document.getElementById('targetImage');
            if (img.complete && img.naturalWidth !== 0) {
                await faceMesh.send({image: img});
            } else {
                img.onload = async () => { await faceMesh.send({image: img}); };
            }
        }

        function drawMakeupOnCanvas() {
            const canvas = document.getElementById('makeupCanvas');
            const img = document.getElementById('targetImage');
            const ctx = canvas.getContext('2d');
            
            canvas.width = img.clientWidth;
            canvas.height = img.clientHeight;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (!appEngineState.landmarks) return;

            const width = canvas.width;
            const height = canvas.height;
            const intensity = appEngineState.sliders.lipstick.intensity.val / 100;

            if (intensity > 0) {
                // Lips precise points (Mediapipe refine landmarks for lips)
                const LIPS_INDICES = [61, 146, 91, 181, 84, 17, 314, 405, 321, 375, 291, 409, 270, 269, 267, 0, 37, 39, 40, 185];
                ctx.beginPath();
                LIPS_INDICES.forEach((index, i) => {
                    const pt = appEngineState.landmarks[index];
                    if (i === 0) ctx.moveTo(pt.x * width, pt.y * height);
                    else ctx.lineTo(pt.x * width, pt.y * height);
                });
                ctx.closePath();
                ctx.fillStyle = appEngineState.currentHexColor;
                ctx.globalAlpha = intensity * 0.6; // Base multiply effect
                ctx.globalCompositeOperation = 'multiply';
                ctx.fill();
            }
        }

        // --- 3. Undo/Redo Engine ---
        function saveState() {
            // Save current parameter object
            const state = JSON.stringify({
                sliders: appEngineState.sliders,
                color: appEngineState.currentHexColor,
                text: appEngineState.textContent,
                filter: document.getElementById('targetImage').style.filter
            });
            appEngineState.history.past.push(state);
            if(appEngineState.history.past.length > 15) appEngineState.history.past.shift();
            appEngineState.history.future = []; // Clear redo stack on new action
        }

        function undoAction() {
            if (appEngineState.history.past.length === 0) return;
            const currentState = JSON.stringify({ sliders: appEngineState.sliders, color: appEngineState.currentHexColor, text: appEngineState.textContent, filter: document.getElementById('targetImage').style.filter });
            appEngineState.history.future.push(currentState);
            
            const prevState = JSON.parse(appEngineState.history.past.pop());
            restoreState(prevState);
        }

        function redoAction() {
            if (appEngineState.history.future.length === 0) return;
            saveState(); // Save current before going forward
            appEngineState.history.past.pop(); // Remove the duplicate save
            const nextState = JSON.parse(appEngineState.history.future.pop());
            restoreState(nextState);
        }

        function restoreState(state) {
            appEngineState.sliders = state.sliders;
            appEngineState.currentHexColor = state.color;
            appEngineState.textContent = state.text;
            document.getElementById('targetImage').style.filter = state.filter;
            document.getElementById('globalTextNode').innerText = state.text;
            executeCoreRenderingPipeline();
            renderControlConsole();
        }

        // --- 4. Eraser (Magic Eraser Fix) ---
        let drawing = false, eraserCtx, maskCanvasObj;
        function initializeEraserSystem() {
            maskCanvasObj = document.getElementById('maskCanvas');
            eraserCtx = maskCanvasObj.getContext('2d');
            maskCanvasObj.addEventListener('mousedown', (e) => { drawing = true; erasePoint(e); });
            maskCanvasObj.addEventListener('mouseup', () => { drawing = false; eraserCtx.beginPath(); saveState(); });
            maskCanvasObj.addEventListener('mousemove', erasePoint);
        }

        function toggleMagicEraserEngine() {
            appEngineState.eraserActive = !appEngineState.eraserActive;
            const btn = document.getElementById('eraserTriggerButton');
            const img = document.getElementById('targetImage');
            
            if (appEngineState.eraserActive) {
                btn.className = "w-full bg-amber-500 text-black p-3.5 rounded-xl flex items-center justify-center gap-2 transition font-bold shadow-md";
                maskCanvasObj.style.pointerEvents = 'auto';
                
                // Draw image to canvas to allow real erasing
                maskCanvasObj.width = img.clientWidth; 
                maskCanvasObj.height = img.clientHeight;
                eraserCtx.drawImage(img, 0, 0, maskCanvasObj.width, maskCanvasObj.height);
                img.style.opacity = 0; // Hide original
                maskCanvasObj.classList.remove('opacity-75', 'pointer-events-none');
                maskCanvasObj.classList.add('z-50');
            } else {
                btn.className = "w-full panel-bg border p-3.5 rounded-xl flex items-center justify-center gap-2 transition text-slate-400 font-medium";
                maskCanvasObj.style.pointerEvents = 'none';
                // Apply changes back to image theoretically (requires complex backend or dataURL)
                img.src = maskCanvasObj.toDataURL();
                img.style.opacity = 1;
                eraserCtx.clearRect(0,0, maskCanvasObj.width, maskCanvasObj.height);
            }
        }

        function erasePoint(e) {
            if (!drawing || !appEngineState.eraserActive) return;
            const rect = maskCanvasObj.getBoundingClientRect();
            const scaleX = maskCanvasObj.width / rect.width;
            const scaleY = maskCanvasObj.height / rect.height;
            const x = (e.clientX - rect.left) * scaleX;
            const y = (e.clientY - rect.top) * scaleY;
            
            eraserCtx.globalCompositeOperation = 'destination-out'; // This actually erases!
            eraserCtx.lineWidth = 30; 
            eraserCtx.lineCap = 'round';
            eraserCtx.lineTo(x, y); 
            eraserCtx.stroke();
            eraserCtx.beginPath(); 
            eraserCtx.moveTo(x, y);
        }

        // --- 5. Dark Mode & Save ---
        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
        }

        function downloadFinalImage() {
            // Create a temporary canvas to composite everything
            const finalCanvas = document.createElement('canvas');
            const img = document.getElementById('targetImage');
            finalCanvas.width = img.clientWidth;
            finalCanvas.height = img.clientHeight;
            const fCtx = finalCanvas.getContext('2d');
            
            // Draw Base Image
            fCtx.filter = img.style.filter;
            fCtx.drawImage(img, 0, 0, finalCanvas.width, finalCanvas.height);
            fCtx.filter = 'none';

            // Draw Makeup
            fCtx.drawImage(document.getElementById('makeupCanvas'), 0, 0);
            
            // Trigger Download
            const link = document.createElement('a');
            link.download = 'KurdFaceStudio_Edited.png';
            link.href = finalCanvas.toDataURL('image/png');
            link.click();
        }

        // --- Core UI Functions ---
        document.addEventListener('DOMContentLoaded', () => {
            renderSubTabsSystem(); renderControlConsole(); initializeEraserSystem();
            processImageForAI(); // Start Mediapipe
        });

        function switchStudioCategory(cat, element) {
            appEngineState.activeCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.replace('bg-amber-500', 'text-slate-500'));
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.replace('text-black', 'text-slate-500'));
            element.className = "cat-btn bg-amber-500 text-black px-4 py-2.5 rounded-xl text-xs font-bold transition flex items-center gap-1.5 shrink-0";
            appEngineState.activeSubTab = hierarchyConfig[cat] ? hierarchyConfig[cat][0].id : null;
            document.getElementById('globalTextNode').style.display = (cat === 'text') ? 'block' : 'none';
            renderSubTabsSystem(); renderControlConsole();
        }

        function renderSubTabsSystem() {
            const bar = document.getElementById('subCategoryContextArea');
            bar.innerHTML = '';
            const pool = hierarchyConfig[appEngineState.activeCategory];
            if(!pool) { bar.classList.add('hidden'); return; }
            bar.classList.remove('hidden');

            pool.forEach(item => {
                const btn = document.createElement('button');
                btn.className = (item.id === appEngineState.activeSubTab) ? "shrink-0 text-xs px-3.5 py-2 rounded-xl bg-amber-500/10 text-amber-500 border border-amber-500/30 font-bold" : "shrink-0 text-xs px-3.5 py-2 rounded-xl text-slate-500 panel-bg border border-slate-700/50";
                btn.innerHTML = `${item.icon} ${item.label}`;
                btn.onclick = () => { appEngineState.activeSubTab = item.id; renderSubTabsSystem(); renderControlConsole(); };
                bar.appendChild(btn);
            });
        }

        function renderControlConsole() {
            const consoleBox = document.getElementById('controlsConsoleArea');
            consoleBox.innerHTML = '';
            const cat = appEngineState.activeCategory;
            const sub = appEngineState.activeSubTab;

            if (['face', 'makeup', 'body'].includes(cat) && appEngineState.sliders[sub]) {
                if (sub === 'lipstick') {
                    const grid = document.createElement('div');
                    grid.className = "grid grid-cols-5 gap-2 mb-3";
                    const tones = ['#dc2626', '#be185d', '#9d174d', '#ea580c'];
                    tones.forEach(color => {
                        grid.innerHTML += `<button onclick="assignLipstickTone('${color}')" class="aspect-square rounded-xl border border-slate-700 hover:scale-105 transition" style="background-color: ${color}"></button>`;
                    });
                    consoleBox.appendChild(grid);
                }
                Object.keys(appEngineState.sliders[sub]).forEach(key => {
                    const wrap = document.createElement('div');
                    wrap.className = "panel-bg border rounded-xl p-3 space-y-2";
                    const data = appEngineState.sliders[sub][key];
                    wrap.innerHTML = `
                        <div class="flex justify-between text-xs font-medium text-slate-500 dark:text-slate-300">
                            <span>${data.label}</span><span id="out-${key}" class="text-amber-500">${data.val}${data.unit}</span>
                        </div>
                        <input type="range" min="${data.min}" max="${data.max}" value="${data.val}" onchange="saveState()" oninput="syncSlider('${sub}', '${key}', this.value)">
                    `;
                    consoleBox.appendChild(wrap);
                });
            } else if (cat === 'filters') {
                const grid = document.createElement('div');
                grid.className = "grid grid-cols-2 gap-3";
                extensiveFiltersList.forEach(f => {
                    grid.innerHTML += `<div onclick="saveState(); applyStudioFilter('${f.id}')" class="cursor-pointer panel-bg border p-3 rounded-xl text-center hover:border-amber-500"><span class="text-xs font-semibold text-slate-500 dark:text-slate-300">${f.label}</span></div>`;
                });
                consoleBox.appendChild(grid);
            } else if (cat === 'ai') {
                consoleBox.innerHTML = `
                    <button onclick="toggleMagicEraserEngine()" id="eraserTriggerButton" class="w-full panel-bg border p-3.5 rounded-xl flex items-center justify-center gap-2 transition text-slate-500 font-medium">🖌️ سڕینەوەی دەستی زیرەک</button>
                `;
            }
        }

        function syncSlider(subTab, key, val) {
            appEngineState.sliders[subTab][key].val = parseInt(val);
            document.getElementById(`out-${key}`).innerText = val + appEngineState.sliders[subTab][key].unit;
            executeCoreRenderingPipeline();
        }

        function executeCoreRenderingPipeline() {
            const img = document.getElementById('targetImage');
            const shape = appEngineState.sliders.shape;
            img.style.transform = `scaleX(${1 + (shape.width.val/100)}) rotateX(${shape.vshape.val*0.3}deg)`;
            drawMakeupOnCanvas();
        }

        function assignLipstickTone(hex) {
            appEngineState.currentHexColor = hex;
            appEngineState.sliders.lipstick.intensity.val = 75;
            saveState();
            renderControlConsole();
            executeCoreRenderingPipeline();
        }

        function applyStudioFilter(id) {
            const found = extensiveFiltersList.find(f => f.id === id);
            document.getElementById('targetImage').style.filter = found && found.matrix ? found.matrix : 'none';
        }

        function loadSampleModel(gender) {
            saveState();
            const img = document.getElementById('targetImage');
            img.src = (gender === 'female') ? "https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=800&auto=format&fit=crop" : "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?q=80&w=800&auto=format&fit=crop";
            img.onload = () => processImageForAI();
        }

        function loadUserPhoto(e) {
            if (e.target.files[0]) {
                saveState();
                const reader = new FileReader();
                reader.onload = (evt) => { 
                    const img = document.getElementById('targetImage');
                    img.src = evt.target.result; 
                    img.onload = () => processImageForAI();
                };
                reader.readAsDataURL(e.target.files[0]);
            }
        }
    </script>
</body>
</html>
