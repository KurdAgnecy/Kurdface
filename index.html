<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kurd Face Studio - Kurd Agency</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- هەندێک فۆنتی باوی گوگڵ بۆ کوردی/عەرەبی/ئینگلیزی -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@300;400;700&family=Cairo:wght@400;700&family=Tajawal:wght@400;700&family=Changa:wght@400;700&family=Lalezar&family=Roboto:wght@400;700&family=Montserrat:wght@400;700&family=Oswald:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Kufi Arabic', sans-serif; background-color: #0d0e12; color: #f3f4f6; user-select: none; }
        .workspace-grid { background-image: radial-gradient(#1f2937 1px, transparent 1px); background-size: 16px 16px; }
        
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 18px; width: 18px; border-radius: 50%; background: #f59e0b; cursor: pointer; margin-top: -7px; box-shadow: 0 0 8px rgba(245, 158, 11, 0.6); }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; background: #374151; border-radius: 2px; }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        #textOverlay {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 32px; color: white; text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            cursor: move; white-space: pre-wrap; text-align: center; display: none; z-index: 40;
            border: 1px dashed transparent; padding: 5px; min-width: 50px;
        }
        #textOverlay:hover { border-color: #f59e0b; }
        
        /* Effect Overlays */
        .effect-layer { position: absolute; inset: 0; pointer-events: none; opacity: 0; background-size: cover; background-position: center; z-index: 20; transition: opacity 0.3s; }
        #sunlightEffect { background-image: repeating-linear-gradient(45deg, rgba(255,255,255,0.1) 0px, rgba(255,255,255,0.1) 20px, transparent 20px, transparent 40px); mix-blend-mode: overlay; }
        #tattooEffect { background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><circle cx="50" cy="50" r="40" stroke="black" stroke-width="3" fill="none"/><path d="M50 10 L50 90 M10 50 L90 50" stroke="black" stroke-width="3"/></svg>'); mix-blend-mode: multiply; background-size: 150px; background-repeat: no-repeat; background-position: 70% 80%; }
        #muscleEffect { background: radial-gradient(circle at 50% 70%, rgba(0,0,0,0.3) 0%, transparent 40%); mix-blend-mode: hard-light; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <header class="bg-[#15171e] border-b border-gray-800 px-6 py-4 flex justify-between items-center shrink-0">
        <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-amber-500 to-yellow-400 flex items-center justify-center font-bold text-black text-lg shadow-lg shadow-amber-500/20">K</div>
            <div>
                <h1 class="text-md font-bold tracking-wide">Kurd Face Studio</h1>
                <p class="text-[10px] text-amber-500">بەڕێوەبردنی پێشکەوتوو</p>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <label class="bg-amber-500 hover:bg-amber-600 text-black text-xs font-bold px-4 py-2 rounded-lg cursor-pointer transition flex items-center gap-1">
                <span>بارکردنی وێنە</span>
                <input type="file" accept="image/*" class="hidden" onchange="previewUserImage(event)">
            </label>
        </div>
    </header>

    <main class="flex-1 flex flex-col lg:flex-row overflow-hidden">
        
        <!-- Live Viewport Canvas -->
        <div class="flex-1 workspace-grid bg-[#090a0f] flex items-center justify-center p-6 relative overflow-hidden h-full">
            <div id="canvasViewport" class="relative max-w-full max-h-full rounded-2xl shadow-2xl overflow-hidden flex items-center justify-center" style="width: 450px; height: 85%;">
                
                <div id="faceMeshWrapper" class="relative w-full h-full flex items-center justify-center transition-all duration-150">
                    <img id="targetImage" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=800&auto=format&fit=crop" class="max-w-full max-h-full object-contain select-none transition-all">
                    
                    <!-- Dynamic Effects -->
                    <div id="sunlightEffect" class="effect-layer"></div>
                    <div id="muscleEffect" class="effect-layer"></div>
                    <div id="tattooEffect" class="effect-layer"></div>
                    
                    <!-- Text Overlay Element -->
                    <div id="textOverlay">دەقی نموونە</div>
                </div>
                
                <canvas id="maskCanvas" class="absolute inset-0 w-full h-full pointer-events-none opacity-60 z-30"></canvas>
                <div id="lipstickLayer" class="absolute inset-0 pointer-events-none mix-blend-multiply opacity-0 z-10" style="background: radial-gradient(circle at 50% 67%, rgba(220,38,38,0.6) 0%, transparent 12%);"></div>
                <div id="blushLayer" class="absolute inset-0 pointer-events-none mix-blend-color-burn opacity-0 z-10" style="background: radial-gradient(circle at 33% 56%, rgba(244,63,94,0.3) 0%, transparent 15%), radial-gradient(circle at 67% 56%, rgba(244,63,94,0.3) 0%, transparent 15%);"></div>
            </div>
        </div>

        <!-- Dashboard (Right) -->
        <div class="w-full lg:w-[480px] bg-[#111217] border-t lg:border-t-0 lg:border-r border-gray-800 flex flex-col h-[55%] lg:h-full shrink-0">
            
            <!-- Category Tabs -->
            <div class="flex overflow-x-auto bg-[#14161d] border-b border-gray-800 p-3 gap-2 no-scrollbar shrink-0">
                <button onclick="changeCategory('face', this)" class="cat-btn bg-amber-500 text-black px-4 py-2 rounded-xl text-xs font-bold transition whitespace-nowrap">دەموچاو</button>
                <button onclick="changeCategory('body', this)" class="cat-btn text-gray-400 hover:text-white px-4 py-2 rounded-xl text-xs font-semibold transition whitespace-nowrap">جەستە (Body)</button>
                <button onclick="changeCategory('makeup', this)" class="cat-btn text-gray-400 hover:text-white px-4 py-2 rounded-xl text-xs font-semibold transition whitespace-nowrap">مەیک ئەپ</button>
                <button onclick="changeCategory('filters', this)" class="cat-btn text-gray-400 hover:text-white px-4 py-2 rounded-xl text-xs font-semibold transition whitespace-nowrap">فلتەر</button>
                <button onclick="changeCategory('effects', this)" class="cat-btn text-gray-400 hover:text-white px-4 py-2 rounded-xl text-xs font-semibold transition whitespace-nowrap">ئیفێکت (Effects)</button>
                <button onclick="changeCategory('text', this)" class="cat-btn text-gray-400 hover:text-white px-4 py-2 rounded-xl text-xs font-semibold transition whitespace-nowrap">دەق (Text)</button>
                <button onclick="changeCategory('ai', this)" class="cat-btn text-gray-400 hover:text-white px-4 py-2 rounded-xl text-xs font-semibold transition whitespace-nowrap">ئامرازەکانی AI</button>
            </div>

            <!-- Sub Tabs -->
            <div id="subTabContextBar" class="flex overflow-x-auto bg-[#181a22]/60 border-b border-gray-800/50 p-2 gap-2 no-scrollbar shrink-0"></div>

            <!-- Controls Console -->
            <div id="controlsConsole" class="flex-1 overflow-y-auto p-4 space-y-4 no-scrollbar"></div>
            
        </div>
    </main>

    <script>
        const studioState = {
            activeCategory: 'face',
            activeSubTab: 'shape',
            drawMode: false,
            textContent: "دەقی نموونە",
            textSettings: { color: '#ffffff', font: 'Noto Kufi Arabic', blend: 'normal', size: 32 },
            
            sliders: {
                shape: { slim: { label: 'باریککردن', val: 0, min: -15, max: 15, unit: '%' }, width: { label: 'پانی دەموچاو', val: 0, min: -20, max: 20, unit: '%' } },
                eyebrows: { thickness: { label: 'ئەستووری برۆ', val: 0, min: -10, max: 10, unit: 'px' } },
                makeup: { lipstick: { label: 'خەستی سووراو', val: 0, min: 0, max: 100, unit: '%' }, blush: { label: 'خەستی ڕوومەتگەشێن', val: 0, min: 0, max: 100, unit: '%' } },
                bodyAuto: { slimBody: { label: 'لاوازکردنی جەستە', val: 0, min: -20, max: 20, unit: '%' }, expand: { label: 'گەورەکردن', val: 0, min: -15, max: 15, unit: '%' } },
                bodyMuscle: { absOpacity: { label: 'ڕوونی ماسولکە (AI)', val: 0, min: 0, max: 100, unit: '%' } },
                bodyTattoo: { tattooOpacity: { label: 'ڕوونی تاتۆ', val: 0, min: 0, max: 100, unit: '%' } },
            }
        };

        const subTabDefinitions = {
            face: [{ id: 'shape', label: 'شێوە (Shape)' }, { id: 'eyebrows', label: 'برۆکان' }],
            makeup: [{ id: 'lipstick', label: 'سووراو (Lipstick)' }, { id: 'blush', label: 'ڕوومەتگەشێن' }],
            body: [{ id: 'bodyAuto', label: 'ئۆتۆماتیک (Auto)' }, { id: 'bodyMuscle', label: 'ماسولکە (Muscle AI)' }, { id: 'bodyTattoo', label: 'تاتۆ (Tattoo)' }],
            effects: [{ id: 'sunlight', label: 'تیشکی خۆر (Sunlight)' }, { id: 'butterfly', label: 'پەپوولە (Butterfly)' }],
            text: [{ id: 'textAdd', label: 'زیادکردن (Add)' }, { id: 'textStyle', label: 'ستایل و فۆنت (Style)' }, { id: 'textBlend', label: 'تێکەڵکردن (Blend)' }]
        };

        const fonts = [
            { name: 'Noto Kufi Arabic', label: 'نۆتۆ کوفی (کوردی/عەرەبی)' },
            { name: 'Cairo', label: 'قاهیرە (عەرەبی)' },
            { name: 'Tajawal', label: 'تەجاوەل (عەرەبی/کوردی)' },
            { name: 'Changa', label: 'چەنگا (عەرەبی دابڕاو)' },
            { name: 'Lalezar', label: 'لالەزار (عەرەبی ئەستوور)' },
            { name: 'Roboto', label: 'ڕۆبۆتۆ (ئینگلیزی باو)' },
            { name: 'Montserrat', label: 'مۆنتسێرات (ئینگلیزی مۆدێرن)' },
            { name: 'Oswald', label: 'ئۆسواڵد (ئینگلیزی باریک)' }
        ];

        document.addEventListener('DOMContentLoaded', () => {
            renderSubTabs();
            renderSliders();
            setupEraserEngine();
            setupTextDragging();
        });

        function changeCategory(cat, element) {
            studioState.activeCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(b => {
                b.className = "cat-btn text-gray-400 hover:text-white px-4 py-2 rounded-xl text-xs font-semibold transition whitespace-nowrap";
            });
            element.className = "cat-btn bg-amber-500 text-black px-4 py-2 rounded-xl text-xs font-bold transition whitespace-nowrap";
            studioState.activeSubTab = subTabDefinitions[cat] ? subTabDefinitions[cat][0].id : null;
            
            // پیشاندان یان شاردنەوەی تێکست
            document.getElementById('textOverlay').style.display = (cat === 'text') ? 'block' : 'none';

            renderSubTabs();
            renderSliders();
        }

        function changeSubTab(subId, element) {
            studioState.activeSubTab = subId;
            document.querySelectorAll('.sub-btn').forEach(b => {
                b.className = "sub-btn shrink-0 text-xs px-3 py-1.5 rounded-lg text-gray-400 bg-gray-900/40 transition";
            });
            element.className = "sub-btn shrink-0 text-xs px-3 py-1.5 rounded-lg bg-amber-500/10 text-amber-500 border border-amber-500/30 font-semibold transition";
            renderSliders();
        }

        function renderSubTabs() {
            const bar = document.getElementById('subTabContextBar');
            bar.innerHTML = '';
            const activePool = subTabDefinitions[studioState.activeCategory];
            if(!activePool) { bar.classList.add('hidden'); return; }
            bar.classList.remove('hidden');

            activePool.forEach(tab => {
                const btn = document.createElement('button');
                btn.className = (tab.id === studioState.activeSubTab) ? "sub-btn shrink-0 text-xs px-3 py-1.5 rounded-lg bg-amber-500/10 text-amber-500 border border-amber-500/30 font-semibold transition" : "sub-btn shrink-0 text-xs px-3 py-1.5 rounded-lg text-gray-400 bg-gray-900/40 transition";
                btn.innerText = tab.label;
                btn.onclick = () => changeSubTab(tab.id, btn);
                bar.appendChild(btn);
            });
        }

        function renderSliders() {
            const consoleBox = document.getElementById('controlsConsole');
            consoleBox.innerHTML = '';
            const cat = studioState.activeCategory;
            const sub = studioState.activeSubTab;

            if (['face', 'makeup', 'body'].includes(cat) && studioState.sliders[sub]) {
                Object.keys(studioState.sliders[sub]).forEach(key => {
                    consoleBox.appendChild(createSliderComponent(key, studioState.sliders[sub][key], sub));
                });
            } 
            else if (cat === 'filters') {
                const filterGrid = document.createElement('div');
                filterGrid.className = "grid grid-cols-3 gap-3";
                const filterList = [
                    { id: 'none', label: 'ئاسایی' }, { id: 'basis', label: 'Basis' }, { id: 'clear', label: 'Clear' },
                    { id: 'cream', label: 'Cream' }, { id: 'sunset', label: 'Sunset' }, { id: 'film', label: 'Film' }
                ];
                filterList.forEach(f => {
                    filterGrid.innerHTML += `<div onclick="applyFilter('${f.id}')" class="cursor-pointer bg-gray-900 border border-gray-800 p-4 rounded-xl text-center hover:border-amber-500 transition"><div class="text-xs font-semibold">${f.label}</div></div>`;
                });
                consoleBox.appendChild(filterGrid);
            }
            else if (cat === 'effects') {
                if (sub === 'sunlight') {
                    consoleBox.innerHTML = `<p class="text-xs text-gray-400 mb-2">هەڵبژاردنی جۆری درەوشانەوەی خۆر (Sunlight 1, 2...):</p>
                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="setEffect('sunlight', 0)" class="p-3 bg-gray-900 rounded-lg text-xs">سڕینەوە 🚫</button>
                        <button onclick="setEffect('sunlight', 0.5)" class="p-3 bg-gray-900 hover:bg-gray-800 rounded-lg text-xs border border-amber-500/30">Sunlight 1 (SL1)</button>
                        <button onclick="setEffect('sunlight', 0.8)" class="p-3 bg-gray-900 hover:bg-gray-800 rounded-lg text-xs border border-amber-500/30">Sunlight 2 (YL1)</button>
                    </div>`;
                } else if (sub === 'butterfly') {
                    consoleBox.innerHTML = `<div class="bg-gray-900 p-4 rounded-xl text-center text-xs text-amber-500 border border-gray-800">ئیفێکتی پەپوولەکان (BF1-BF11) زیاد دەکرێت بۆ چاویلکەی زیرەک. شێوەیەکی نموونەیی چالاک بکە.</div>
                    <button onclick="alert('پەپوولەی سێ دووری (3D Butterfly) چالاک کرا')" class="mt-4 w-full bg-indigo-600 p-3 rounded-lg text-xs font-bold text-white shadow-lg">دانانی پەپوولە 🦋</button>`;
                }
            }
            else if (cat === 'text') {
                if (sub === 'textAdd') {
                    consoleBox.innerHTML = `
                        <div class="space-y-4">
                            <div>
                                <label class="text-xs text-gray-400 block mb-1">نووسینەکەت لێرە بنووسە:</label>
                                <textarea id="textInputBox" oninput="updateTextContent(this.value)" class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-white text-sm focus:border-amber-500 focus:outline-none" rows="3">${studioState.textContent}</textarea>
                            </div>
                            <p class="text-[10px] text-gray-500 text-center">دەتوانیت تێکستەکە لەسەر وێنەکە بە ماوس/پەنجە ڕابکێشیت بۆ گۆڕینی شوێنەکەی.</p>
                        </div>
                    `;
                } else if (sub === 'textStyle') {
                    let fontOptions = fonts.map(f => `<option value="${f.name}" style="font-family: '${f.name}'">${f.label}</option>`).join('');
                    consoleBox.innerHTML = `
                        <div class="space-y-4">
                            <div>
                                <label class="text-xs text-gray-400 block mb-1">هەڵبژاردنی فۆنت:</label>
                                <select onchange="updateTextFont(this.value)" class="w-full bg-gray-900 border border-gray-700 rounded-xl p-2 text-white text-sm outline-none">
                                    ${fontOptions}
                                </select>
                            </div>
                            <div class="bg-gray-900/50 border border-amber-500/30 rounded-xl p-4 text-center">
                                <label class="text-xs text-amber-500 font-bold block mb-2">یان فۆنتی تایبەتی خۆت باربکە (.ttf, .otf)</label>
                                <input type="file" id="customFontLoader" accept=".ttf,.otf,.woff" class="hidden" onchange="loadCustomFont(event)">
                                <label for="customFontLoader" class="bg-gray-800 hover:bg-gray-700 text-white text-xs px-4 py-2 rounded cursor-pointer inline-block transition">هەڵبژاردنی فایلی فۆنت 📁</label>
                            </div>
                            <div>
                                <label class="text-xs text-gray-400 block mb-1">ڕەنگی دەق:</label>
                                <input type="color" oninput="updateTextColor(this.value)" value="${studioState.textSettings.color}" class="w-full h-10 rounded-lg cursor-pointer bg-transparent border-0">
                            </div>
                        </div>
                    `;
                    // Set current font in select
                    const select = consoleBox.querySelector('select');
                    if(select) select.value = studioState.textSettings.font;
                } else if (sub === 'textBlend') {
                    consoleBox.innerHTML = `
                        <div class="grid grid-cols-2 gap-2">
                            <button onclick="updateTextBlend('normal')" class="p-2 bg-gray-900 border border-gray-800 rounded text-xs hover:border-amber-500">ئاسایی (Normal)</button>
                            <button onclick="updateTextBlend('overlay')" class="p-2 bg-gray-900 border border-gray-800 rounded text-xs hover:border-amber-500">سەرپۆش (Overlay)</button>
                            <button onclick="updateTextBlend('multiply')" class="p-2 bg-gray-900 border border-gray-800 rounded text-xs hover:border-amber-500">تاریککردن (Multiply)</button>
                            <button onclick="updateTextBlend('screen')" class="p-2 bg-gray-900 border border-gray-800 rounded text-xs hover:border-amber-500">ڕووناککردن (Screen)</button>
                        </div>
                    `;
                }
            }
            else if (cat === 'ai') {
                consoleBox.innerHTML = `
                    <button onclick="triggerBgRemovalAPI()" class="w-full bg-gradient-to-r from-amber-500 to-yellow-500 text-black font-bold p-4 rounded-xl flex items-center justify-center gap-3 transition hover:opacity-90 shadow-lg mb-3">
                        <span>✂️</span> <div class="text-xs font-bold">لابردنی باکگراوند (Remove BG)</div>
                    </button>
                    <button onclick="toggleDrawMode()" id="brushActionBtn" class="w-full bg-gray-900 hover:bg-gray-800 border border-gray-800 p-4 rounded-xl flex items-center justify-center gap-3 transition">
                        <span>🖌️</span> <div class="text-xs font-bold">سڕینەوەی دەستی (Magic Eraser)</div>
                    </button>
                `;
            }
        }

        function createSliderComponent(key, item, subTab) {
            const div = document.createElement('div');
            div.className = "bg-gray-900/50 border border-gray-800/60 rounded-xl p-3 space-y-2";
            div.innerHTML = `
                <div class="flex justify-between items-center text-xs">
                    <span class="text-gray-300 font-medium">${item.label}</span>
                    <span id="label-${key}" class="text-amber-500 font-mono font-bold">${item.val}${item.unit}</span>
                </div>
                <input type="range" min="${item.min}" max="${item.max}" value="${item.val}" oninput="processSlider('${subTab}', '${key}', this.value)">
            `;
            return div;
        }

        function processSlider(subTab, key, value) {
            const intVal = parseInt(value);
            const unit = studioState.sliders[subTab][key].unit;
            document.getElementById(`label-${key}`).innerText = value + unit;
            studioState.sliders[subTab][key].val = intVal;
            executeLiveRenderingPipeline();
        }

        function executeLiveRenderingPipeline() {
            const targetImage = document.getElementById('targetImage');
            
            // Face Shape logic
            const shape = studioState.sliders.shape;
            const widthValue = 1 + (shape.width.val / 100);
            
            // Body Logic
            const bodyAuto = studioState.sliders.bodyAuto;
            const scaleY = 1 + (bodyAuto.expand.val / 100);
            const scaleX = widthValue - (bodyAuto.slimBody.val / 100);

            targetImage.style.transform = `scaleX(${scaleX}) scaleY(${scaleY})`;

            // Body Overlay Logic
            document.getElementById('muscleEffect').style.opacity = studioState.sliders.bodyMuscle ? (studioState.sliders.bodyMuscle.absOpacity.val / 100) : 0;
            document.getElementById('tattooEffect').style.opacity = studioState.sliders.bodyTattoo ? (studioState.sliders.bodyTattoo.tattooOpacity.val / 100) : 0;

            // Makeup Logic
            if(studioState.sliders.makeup) {
                document.getElementById('lipstickLayer').style.opacity = studioState.sliders.makeup.lipstick.val / 100;
                document.getElementById('blushLayer').style.opacity = studioState.sliders.makeup.blush.val / 100;
            }
        }

        // --- بەشی تێکست و فۆنت (Text & Font Engine) ---
        function updateTextContent(val) {
            studioState.textContent = val;
            document.getElementById('textOverlay').innerText = val;
        }
        function updateTextFont(fontName) {
            studioState.textSettings.font = fontName;
            document.getElementById('textOverlay').style.fontFamily = `"${fontName}", sans-serif`;
        }
        function updateTextColor(colorHex) {
            studioState.textSettings.color = colorHex;
            document.getElementById('textOverlay').style.color = colorHex;
        }
        function updateTextBlend(mode) {
            studioState.textSettings.blend = mode;
            document.getElementById('textOverlay').style.mixBlendMode = mode;
        }

        // بارکردنی فۆنتی تایبەتی بەکارهێنەر
        function loadCustomFont(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const fontName = 'UserCustomFont_' + Date.now();
                const customFont = new FontFace(fontName, `url(${e.target.result})`);
                customFont.load().then((loadedFont) => {
                    document.fonts.add(loadedFont);
                    updateTextFont(fontName);
                    alert("فۆنتە تایبەتەکەت بە سەرکەوتوویی بارکرا و جێبەجێ کرا!");
                }).catch(err => {
                    alert("ببورە، کێشەیەک لە خوێندنەوەی فۆنتەکەدا هەیە.");
                });
            };
            reader.readAsDataURL(file);
        }

        // ڕاکێشانی تێکست (Text Dragging)
        function setupTextDragging() {
            const textEl = document.getElementById('textOverlay');
            let isDragging = false, startX, startY, initialX, initialY;

            textEl.addEventListener('mousedown', dragStart);
            textEl.addEventListener('touchstart', dragStart, {passive: false});

            function dragStart(e) {
                if(studioState.activeCategory !== 'text') return;
                isDragging = true;
                const pos = textEl.getBoundingClientRect();
                const parentPos = textEl.parentElement.getBoundingClientRect();
                
                initialX = textEl.offsetLeft;
                initialY = textEl.offsetTop;
                
                if(e.type === 'touchstart') {
                    startX = e.touches[0].clientX;
                    startY = e.touches[0].clientY;
                } else {
                    startX = e.clientX;
                    startY = e.clientY;
                }
                
                document.addEventListener('mousemove', drag);
                document.addEventListener('touchmove', drag, {passive: false});
                document.addEventListener('mouseup', dragEnd);
                document.addEventListener('touchend', dragEnd);
            }

            function drag(e) {
                if (!isDragging) return;
                e.preventDefault();
                let currentX, currentY;
                if(e.type === 'touchmove') {
                    currentX = e.touches[0].clientX;
                    currentY = e.touches[0].clientY;
                } else {
                    currentX = e.clientX;
                    currentY = e.clientY;
                }
                
                const diffX = currentX - startX;
                const diffY = currentY - startY;
                
                textEl.style.left = (initialX + diffX) + 'px';
                textEl.style.top = (initialY + diffY) + 'px';
                textEl.style.transform = `translate(-50%, -50%)`; // Keep centering relative to point
            }

            function dragEnd() {
                isDragging = false;
                document.removeEventListener('mousemove', drag);
                document.removeEventListener('touchmove', drag);
                document.removeEventListener('mouseup', dragEnd);
                document.removeEventListener('touchend', dragEnd);
            }
        }

        // Effects
        function setEffect(type, opacity) {
            if(type === 'sunlight') document.getElementById('sunlightEffect').style.opacity = opacity;
        }

        function applyFilter(filterId) {
            const img = document.getElementById('targetImage');
            const matrix = {
                none: 'none', basis: 'contrast(1.18) brightness(1.02) saturate(1.15)',
                clear: 'brightness(1.12) contrast(1.05) saturate(0.95)',
                cream: 'sepia(0.15) brightness(1.05) saturate(1.1) contrast(0.95)',
                sunset: 'sepia(0.4) saturate(1.5) hue-rotate(-15deg) brightness(0.95)',
                film: 'contrast(0.9) brightness(1.05) sepia(0.2) saturate(0.9)'
            };
            img.style.filter = matrix[filterId] || 'none';
        }

        // Image & API
        function previewUserImage(e) {
            const file = e.target.files[0];
            if(file) {
                const r = new FileReader();
                r.onload = function(event) { document.getElementById('targetImage').src = event.target.result; };
                r.readAsDataURL(file);
            }
        }

        let isDrawing = false; let ctx, maskCanvas;
        function setupEraserEngine() {
            maskCanvas = document.getElementById('maskCanvas');
            ctx = maskCanvas.getContext('2d');
            maskCanvas.addEventListener('mousedown', () => isDrawing = true);
            maskCanvas.addEventListener('mouseup', () => { isDrawing = false; ctx.beginPath(); });
            maskCanvas.addEventListener('mousemove', drawMaskPath);
        }
        function toggleDrawMode() {
            studioState.drawMode = !studioState.drawMode;
            const btn = document.getElementById('brushActionBtn');
            if(studioState.drawMode) {
                btn.className = "w-full bg-amber-500 text-black p-4 rounded-xl flex items-center justify-center gap-3 transition font-bold";
                maskCanvas.style.pointerEvents = 'auto';
                maskCanvas.width = document.getElementById('targetImage').clientWidth;
                maskCanvas.height = document.getElementById('targetImage').clientHeight;
            } else {
                btn.className = "w-full bg-gray-900 hover:bg-gray-800 border border-gray-800 p-4 rounded-xl flex items-center justify-center gap-3 transition";
                maskCanvas.style.pointerEvents = 'none';
            }
        }
        function drawMaskPath(e) {
            if (!isDrawing || !studioState.drawMode) return;
            const rect = maskCanvas.getBoundingClientRect();
            ctx.lineWidth = 20; ctx.lineCap = 'round'; ctx.strokeStyle = 'rgba(239, 68, 68, 0.7)';
            ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
        }

        }
    </script>
