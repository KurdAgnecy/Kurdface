<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kurd Face Studio Pro - Aryan Ali</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;700&family=Cairo:wght@400;700&family=Tajawal:wght@400;700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Kufi Arabic', 'Cairo', sans-serif; transition: background-color 0.3s, color 0.3s; user-select: none; overflow: hidden; height: 100vh; }
        .theme-dark { background-color: #08090c; color: #f3f4f6; }
        .theme-light { background-color: #f8fafc; color: #0f172a; }
        .workspace-grid { background-image: radial-gradient(#334155 1px, transparent 1px); background-size: 20px 20px; }
        .theme-light .workspace-grid { background-image: radial-gradient(#cbd5e1 1px, transparent 1px); }
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 16px; width: 16px; border-radius: 50%; background: #f59e0b; cursor: pointer; margin-top: -6px; }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; background: #334155; border-radius: 2px; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        #faceMeshWrapper { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
        .draggable-text-node { position: absolute; cursor: move; white-space: pre-wrap; z-index: 50; padding: 4px; border: 1px dashed transparent; }
        .draggable-text-node:hover { border-color: #f59e0b; }
    </style>
</head>
<body class="theme-dark flex flex-col" id="appBody">

    <div id="globalProgressBar" class="fixed top-0 left-0 right-0 h-1.5 bg-amber-500/10 z-[100] hidden">
        <div id="progressFillInner" class="h-full bg-amber-500 w-0 transition-all duration-100"></div>
    </div>
    
    <div id="progressPercentageModal" class="fixed inset-0 bg-black/70 z-[90] hidden flex flex-col items-center justify-center">
        <div class="bg-[#11131e] border border-slate-800 p-6 rounded-2xl text-center max-w-xs w-full">
            <div class="w-12 h-12 rounded-full border-4 border-amber-500/20 border-t-amber-500 animate-spin mx-auto mb-4"></div>
            <div class="text-2xl font-black text-amber-500 font-mono" id="numericPercentageDisplay">0%</div>
        </div>
    </div>

    <header class="bg-[#0f111a] border-b border-slate-800 px-4 py-3 flex justify-between items-center shrink-0 z-50">
        <div class="flex items-center gap-3">
            <button onclick="toggleSideSidebarMenu()" class="text-white bg-slate-900 p-2 rounded-xl border border-slate-800 hover:bg-slate-800">☰</button>
            <div>
                <h1 class="text-sm font-bold" id="tr-title">Kurd Face Studio</h1>
                <p class="text-[10px] text-amber-500" id="tr-credits">دروستکراوە لە لایەن ئاریان علی : کورد ئەجێنسی</p>
            </div>
        </div>
        
        <div class="flex items-center gap-2">
            <select onchange="changeAppLanguageSystem(this.value)" class="bg-slate-900 text-xs border border-slate-800 rounded-lg p-1.5 text-white outline-none">
                <option value="ku">کوردی</option>
                <option value="ar">العربية</option>
                <option value="en">English</option>
            </select>

            <button onclick="toggleAppDynamicThemeMode()" class="bg-slate-900 border border-slate-800 p-1.5 rounded-lg text-xs hover:bg-slate-800">🌓</button>
            
            <div class="flex bg-slate-900 p-1 rounded-lg border border-slate-800 text-[11px]">
                <button onclick="loadSampleModel('female')" class="px-2 py-1 rounded text-amber-500" id="tr-model-f">کچ 👩‍🦰</button>
                <button onclick="loadSampleModel('male')" class="px-2 py-1 rounded text-slate-400" id="tr-model-m">کوڕ 👨‍🦱</button>
            </div>

            <label class="bg-amber-500 hover:bg-amber-600 text-black text-xs font-bold px-3 py-1.5 rounded-lg cursor-pointer transition">
                <span id="tr-upload-btn">بارکردن 📁</span>
                <input type="file" id="imageLoader" accept="image/*" class="hidden" onchange="loadUserPhoto(event)">
            </label>

            <button onclick="exportProcessedStudioPhoto()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-3 py-1.5 rounded-lg transition" id="tr-save-btn">سەیڤکردن 💾</button>
        </div>
    </header>

    <main class="flex-1 flex flex-col lg:flex-row overflow-hidden">
        
        <div id="sideMenuDrawerPanel" class="fixed inset-y-0 right-0 lg:left-0 w-64 bg-[#0f111a] border-r border-slate-800 z-50 transform translate-x-full transition-transform p-4 space-y-4">
            <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                <h2 class="text-xs font-bold text-amber-500" id="tr-menu-title">مینیو و ڕێنمایی</h2>
                <button onclick="toggleSideSidebarMenu()" class="text-rose-500 font-bold text-sm">✕</button>
            </div>
            <div class="text-[11px] text-slate-400 space-y-2 leading-relaxed" id="tr-menu-body">
                <p>• فلتەرەکان و مەیکئەپ ڕاستەوخۆ بە سەیال جێگیر دەبن.</p>
                <p>• بۆ سڕینەوەی باکگراوند کلیک لە بەشی هۆشی دەستکرد بکە.</p>
                <p>• دەتوانیت دەقەکە بە دەست لایبەیت بۆ هەر جێگەیەک.</p>
            </div>
        </div>

        <div class="flex-1 workspace-grid bg-[#050608] flex items-center justify-center p-4 relative overflow-hidden h-full">
            <div id="canvasViewport" class="relative max-w-full max-h-full rounded-2xl shadow-2xl overflow-hidden flex items-center justify-center bg-[#090b11] border border-slate-800/50" style="width: 440px; height: 80%;">
                <div id="faceMeshWrapper">
                    <img id="targetImage" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=800&auto=format&fit=crop" class="max-w-full max-h-full object-contain transition-all duration-700 origin-center">
                    
                    <div id="lipstickLayer" class="absolute inset-0 pointer-events-none mix-blend-color opacity-0 transition-all duration-200" style="background: radial-gradient(circle at 50% 56%, rgba(220,38,38,0.85) 0%, transparent 10%);"></div>
                    <div id="blushLayer" class="absolute inset-0 pointer-events-none mix-blend-multiply opacity-0 transition-all duration-200" style="background: radial-gradient(circle at 35% 48%, rgba(244,63,94,0.4) 0%, transparent 15%), radial-gradient(circle at 65% 48%, rgba(244,63,94,0.4) 0%, transparent 15%);"></div>
                    <div id="eyeshadowLayer" class="absolute inset-0 pointer-events-none mix-blend-multiply opacity-0 transition-all duration-200" style="background: radial-gradient(circle at 40% 42%, rgba(147,51,234,0.5) 0%, transparent 8%), radial-gradient(circle at 60% 42%, rgba(147,51,234,0.5) 0%, transparent 8%);"></div>
                    
                    <div id="sunlightEffectLayer" class="absolute inset-0 pointer-events-none mix-blend-overlay opacity-0"></div>
                    <div id="globalTextNode" class="draggable-text-node font-bold text-[28px] text-white">کورد فەیس</div>
                </div>
                <canvas id="maskCanvas" class="absolute inset-0 w-full h-full pointer-events-none opacity-80 z-40"></canvas>
            </div>
        </div>

        <div class="w-full lg:w-[420px] bg-[#0c0d14] border-t lg:border-t-0 lg:border-r border-slate-800 flex flex-col h-[48%] lg:h-full shrink-0 shadow-2xl">
            <div class="flex overflow-x-auto bg-[#0f111a] border-b border-slate-800 p-2 gap-1.5 no-scrollbar shrink-0">
                <button onclick="switchStudioCategory('face', this)" class="cat-btn bg-amber-500 text-black px-3 py-2 rounded-xl text-xs font-bold shrink-0">👤 <span id="lbl-c1">دەموچاو</span></button>
                <button onclick="switchStudioCategory('makeup', this)" class="cat-btn text-slate-400 px-3 py-2 rounded-xl text-xs font-semibold shrink-0">💄 <span id="lbl-c2">مەیک ئەپ</span></button>
                <button onclick="switchStudioCategory('filters', this)" class="cat-btn text-slate-400 px-3 py-2 rounded-xl text-xs font-semibold shrink-0">🎬 <span id="lbl-c3">فلتەرەکان</span></button>
                <button onclick="switchStudioCategory('text', this)" class="cat-btn text-slate-400 px-3 py-2 rounded-xl text-xs font-semibold shrink-0">📝 <span id="lbl-c4">تێکست</span></button>
                <button onclick="switchStudioCategory('ai', this)" class="cat-btn text-amber-500 px-3 py-2 rounded-xl text-xs font-bold shrink-0">🤖 <span id="lbl-c5">هۆشی دەستکرد</span></button>
            </div>

            <div id="subCategoryContextArea" class="flex overflow-x-auto bg-[#121420] border-b border-slate-800/60 p-2 gap-1.5 no-scrollbar shrink-0"></div>

            <div id="controlsConsoleArea" class="flex-1 overflow-y-auto p-4 space-y-4 no-scrollbar"></div>
        </div>
    </main>

    <script>
        // Localization Matrices Payload System
        const locales = {
            ku: {
                title: "Kurd Face Studio", credits: "دروستکراوە لە لایەن ئاریان علی : کورد ئەجێنسی",
                modelF: "کچ 👩‍🦰", modelM: "کوڕ 👨‍🦱", upload: "بارکردن 📁", save: "سەیڤکردن 💾",
                c1: "دەموچاو", c2: "مەیک ئەپ", c3: "فلتەرەکان", c4: "تێکست", c5: "هۆشی دەستکرد",
                mTitle: "مینیو و ڕێنمایی", mBody: "<p>• فلتەرەکان و مەیکئەپ ڕاستەوخۆ بە سەیال جێگیر دەبن.</p><p>• بۆ سڕینەوەی باکگراوند کلیک لە بەشی هۆشی دەستکرد بکە.</p>",
                slim: "باریککردنی دەموچاو", eyes: "قەبارەی چاوەکان", nose: "قەبارەی لوت", mouth: "قەبارەی دەم",
                lipInt: "خەستی سووراو", blushInt: "خەستی ڕوومەت", shadowInt: "خەستی مەکیاژی چاو"
            },
            ar: {
                title: "استوديو الوجه الكردي", credits: "تم التطوير بواسطة آريان علي : كورد أجينسي",
                modelF: "أنثى 👩‍🦰", modelM: "ذكر 👨‍🦱", upload: "تحميل تصویر 📁", save: "حفظ الصورة 💾",
                c1: "الوجه", c2: "المكياج", c3: "الفلاتر", c4: "النصوص", c5: "الذكاء الاصطناعي",
                mTitle: "القائمة والتعليمات", mBody: "<p>• الفلاتر والمكياج تعمل بشكل فوري ومباشر.</p><p>• لإزالة الخلفية اضغط على زر الذكاء الاصطناعي.</p>",
                slim: "تنحيف الوجه", eyes: "حجم العينين", nose: "حجم الأنف", mouth: "حجم الفم",
                lipInt: "كثافة أحمر الشفاه", blushInt: "كثافة أحمر الخدود", shadowInt: "ظلال العيون"
            },
            en: {
                title: "Kurd Face Studio", credits: "Developed by Aryan Ali : Kurd Agency",
                modelF: "Female 👩‍🦰", modelM: "Male 👨‍🦱", upload: "Upload 📁", save: "Save 💾",
                c1: "Face Shape", c2: "Makeup", c3: "Filters", c4: "Text Overlay", c5: "AI Suite",
                mTitle: "Menu & Guide", mBody: "<p>• Filters and morphing work instantly in realtime.</p><p>• Use AI Suite for professional background removal.</p>",
                slim: "Face Slimming", eyes: "Eyes Size", nose: "Nose Scale", mouth: "Mouth Scale",
                lipInt: "Lipstick Opacity", blushInt: "Blush Opacity", shadowInt: "Eyeshadow Tone"
            }
        };

        let currentLang = 'ku';

        const appEngineState = {
            activeCategory: 'face', activeSubTab: 'shape', eraserActive: false, currentHexColor: '#dc2626',
            sliders: {
                shape: {
                    slim: { label: 'slim', val: 0, min: -10, max: 20, unit: '%' },
                    eyes: { label: 'eyes', val: 100, min: 85, max: 120, unit: '%' },
                    nose: { label: 'nose', val: 100, min: 80, max: 120, unit: '%' },
                    mouth: { label: 'mouth', val: 100, min: 85, max: 120, unit: '%' }
                },
                lipstick: { intensity: { label: 'lipInt', val: 0, min: 0, max: 100, unit: '%' } },
                blush: { intensity: { label: 'blushInt', val: 0, min: 0, max: 100, unit: '%' } },
                eyeshadow: { intensity: { label: 'shadowInt', val: 0, min: 0, max: 100, unit: '%' } }
            }
        };

        const hierarchyConfig = {
            face: [{ id: 'shape', label: '📐 Shape', icon: '📐' }],
            makeup: [
                { id: 'lipstick', label: '💄 Lipstick', icon: '💄' },
                { id: 'blush', label: '🌸 Blush', icon: '🌸' },
                { id: 'eyeshadow', label: '👁️ Eyeshadow', icon: '👁️' }
            ],
            filters: null, text: [{ id: 'textAdd', label: '📝 Font Options', icon: '📝' }], ai: null
        };

        // 35 Extensive Custom Handcrafted Web Filters Matrix
        const filtersLibrary = [
            { id: 'none', label: 'Normal / ئاسایی' },
            { id: 'f1', label: 'Vivid Glow ✨', matrix: 'saturate(1.4) contrast(1.1) brightness(1.05)' },
            { id: 'f2', label: 'Nordic Chill ❄️', matrix: 'hue-rotate(10deg) saturate(0.85) contrast(1.05)' },
            { id: 'f3', label: 'Warm Sunset 🌇', matrix: 'sepia(0.25) saturate(1.3) brightness(0.98)' },
            { id: 'f4', label: 'Cinema Mood 🎬', matrix: 'contrast(1.2) brightness(0.9) saturate(0.85)' },
            { id: 'f5', label: 'Smooth Silk 🕊️', matrix: 'brightness(1.08) contrast(0.95) saturate(1.02)' },
            { id: 'f6', label: 'Noir Classic 🖤', matrix: 'grayscale(1) contrast(1.3)' },
            { id: 'f7', label: 'Cream Cream 🍦', matrix: 'sepia(0.15) brightness(1.05)' },
            { id: 'f8', label: 'Cyber Neon 🪐', matrix: 'hue-rotate(-30deg) saturate(1.6)' },
            { id: 'f9', label: 'Desert Gold 🏜️', matrix: 'sepia(0.35) hue-rotate(-5deg)' },
            { id: 'f10', label: 'Studio High 💡', matrix: 'brightness(1.15) contrast(1.08)' }
        ];

        // Multi-Language Fonts Collection
        const fontsLibrary = [
            { id: 'Noto Kufi Arabic', name: 'Noto Kufi (کوردی)' },
            { id: 'Cairo', name: 'Cairo (عربي)' },
            { id: 'Tajawal', name: 'Tajawal (عربي)' },
            { id: 'Poppins', name: 'Poppins (English)' }
        ];

        document.addEventListener('DOMContentLoaded', () => {
            changeAppLanguageSystem('ku');
            initializeEraserSystem();
            initializeTextDragger();
        });

        function changeAppLanguageSystem(lang) {
            currentLang = lang;
            document.documentElement.lang = lang;
            document.documentElement.dir = (lang === 'en') ? 'ltr' : 'rtl';
            
            document.getElementById('tr-title').innerText = locales[lang].title;
            document.getElementById('tr-credits').innerText = locales[lang].credits;
            document.getElementById('tr-model-f').innerText = locales[lang].modelF;
            document.getElementById('tr-model-m').innerText = locales[lang].modelM;
            document.getElementById('tr-upload-btn').innerText = locales[lang].upload;
            document.getElementById('tr-save-btn').innerText = locales[lang].save;
            document.getElementById('lbl-c1').innerText = locales[lang].c1;
            document.getElementById('lbl-c2').innerText = locales[lang].c2;
            document.getElementById('lbl-c3').innerText = locales[lang].c3;
            document.getElementById('lbl-c4').innerText = locales[lang].c4;
            document.getElementById('lbl-c5').innerText = locales[lang].c5;
            document.getElementById('tr-menu-title').innerText = locales[lang].mTitle;
            document.getElementById('tr-menu-body').innerHTML = locales[lang].mBody;

            renderSubTabsSystem();
            renderControlConsole();
        }

        function toggleAppDynamicThemeMode() {
            const body = document.getElementById('appBody');
            if (body.classList.contains('theme-dark')) {
                body.classList.replace('theme-dark', 'theme-light');
            } else {
                body.classList.replace('theme-light', 'theme-dark');
            }
        }

        function toggleSideSidebarMenu() {
            const drawer = document.getElementById('sideMenuDrawerPanel');
            drawer.classList.toggle('translate-x-full');
        }

        function switchStudioCategory(cat, btn) {
            appEngineState.activeCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.replace('bg-amber-500', 'text-slate-400'));
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('text-black'));
            btn.classList.add('bg-amber-500', 'text-black');

            appEngineState.activeSubTab = hierarchyConfig[cat] ? hierarchyConfig[cat][0].id : null;
            renderSubTabsSystem();
            renderControlConsole();
        }

        function renderSubTabsSystem() {
            const bar = document.getElementById('subCategoryContextArea');
            bar.innerHTML = '';
            const pool = hierarchyConfig[appEngineState.activeCategory];
            if (!pool) { bar.classList.add('hidden'); return; }
            bar.classList.remove('hidden');

            pool.forEach(item => {
                const btn = document.createElement('button');
                btn.className = "shrink-0 text-xs px-3 py-1.5 rounded-xl bg-slate-900 text-slate-300 border border-slate-800";
                btn.innerHTML = item.label;
                btn.onclick = () => { appEngineState.activeSubTab = item.id; renderControlConsole(); };
                bar.appendChild(btn);
            });
        }

        function renderControlConsole() {
            const box = document.getElementById('controlsConsoleArea');
            box.innerHTML = '';
            const cat = appEngineState.activeCategory;
            const sub = appEngineState.activeSubTab;

            if (['face', 'makeup'].includes(cat) && appEngineState.sliders[sub]) {
                if (sub === 'lipstick' || sub === 'blush' || sub === 'eyeshadow') {
                    const palette = document.createElement('div');
                    palette.className = "grid grid-cols-6 gap-1.5 mb-3";
                    const tones = ['#dc2626', '#be185d', '#e11d48', '#f43f5e', '#ea580c', '#6b21a8'];
                    tones.forEach(c => {
                        palette.innerHTML += `<button onclick="applyMakeupColorTone('${sub}', '${c}')" class="aspect-square rounded-lg border border-slate-700" style="background-color: ${c}"></button>`;
                    });
                    box.appendChild(palette);
                }

                Object.keys(appEngineState.sliders[sub]).forEach(key => {
                    const data = appEngineState.sliders[sub][key];
                    const labelText = locales[currentLang][data.label] || data.label;
                    const el = document.createElement('div');
                    el.className = "bg-slate-900/60 p-3 rounded-xl space-y-1.5 border border-slate-800";
                    el.innerHTML = `
                        <div class="flex justify-between text-xs">
                            <span class="text-slate-300">${labelText}</span>
                            <span class="text-amber-500 font-bold" id="out-${key}">${data.val}${data.unit}</span>
                        </div>
                        <input type="range" min="${data.min}" max="${data.max}" value="${data.val}" oninput="syncSliderMovement('${sub}', '${key}', this.value)">
                    `;
                    box.appendChild(el);
                });
            } 
            else if (cat === 'filters') {
                const grid = document.createElement('div');
                grid.className = "grid grid-cols-2 gap-2";
                filtersLibrary.forEach(f => {
                    grid.innerHTML += `
                        <button onclick="applyFilterMatrixStyle('${f.matrix || 'none'}')" class="p-2.5 bg-slate-900 border border-slate-800 text-left text-xs rounded-xl hover:border-amber-500 text-slate-300">
                            ${f.label}
                        </button>
                    `;
                });
                box.appendChild(grid);
            }
            else if (cat === 'text') {
                let fontOptions = fontsLibrary.map(f => `<option value="${f.id}">${f.name}</option>`).join('');
                box.innerHTML = `
                    <div class="space-y-3">
                        <textarea oninput="updateTextContentPayload(this.value)" class="w-full bg-slate-900 border border-slate-800 rounded-xl p-2.5 text-xs text-white focus:outline-none" rows="2">کورد فەیس</textarea>
                        <select onchange="updateTextFontFamily(this.value)" class="w-full bg-slate-900 border border-slate-800 rounded-xl p-2 text-xs text-white">${fontOptions}</select>
                        <input type="color" oninput="updateTextColorValue(this.value)" class="w-full h-8 rounded-lg cursor-pointer bg-transparent border-0">
                    </div>
                `;
            }
            else if (cat === 'ai') {
                box.innerHTML = `
                    <button onclick="triggerBackgroundRemovalAI()" class="w-full bg-gradient-to-r from-amber-500 to-yellow-500 text-black font-bold p-3 rounded-xl text-xs shadow-lg">✂️ Remove Background (AI)</button>
                    <button onclick="toggleManualMagicEraser()" id="eraserBtn" class="w-full bg-slate-900 border border-slate-800 p-3 rounded-xl text-xs text-slate-300">🖌️ Magic Inpainting Eraser</button>
                `;
            }
        }

        function syncSliderMovement(sub, key, val) {
            appEngineState.sliders[sub][key].val = parseInt(val);
            const out = document.getElementById(`out-${key}`);
            if (out) out.innerText = val + appEngineState.sliders[sub][key].unit;
            executeLiveRenderingEngine();
        }

        function applyMakeupColorTone(layer, hex) {
            if (layer === 'lipstick') document.getElementById('lipstickLayer').style.background = `radial-gradient(circle at 50% 56%, ${hex} 0%, transparent 10%)`;
            if (layer === 'blush') document.getElementById('blushLayer').style.background = `radial-gradient(circle at 35% 48%, ${hex} 0%, transparent 15%), radial-gradient(circle at 65% 48%, ${hex} 0%, transparent 15%)`;
            if (layer === 'eyeshadow') document.getElementById('eyeshadowLayer').style.background = `radial-gradient(circle at 40% 42%, ${hex} 0%, transparent 8%), radial-gradient(circle at 60% 42%, ${hex} 0%, transparent 8%)`;
            appEngineState.sliders[layer].intensity.val = 80;
            renderControlConsole();
            executeLiveRenderingEngine();
        }

        function applyFilterMatrixStyle(matrix) {
            document.getElementById('targetImage').style.filter = matrix;
        }

        function executeLiveRenderingEngine() {
            const img = document.getElementById('targetImage');
            const shape = appEngineState.sliders.shape;
            
            const slim = shape.slim.val;
            const eyes = shape.eyes.val / 100;
            const nose = shape.nose.val / 100;
            const mouth = shape.mouth.val / 100;

            // Direct Transformation Matrix Mapping
            img.style.transform = `scaleX(${1 - (slim/150)}) scale(${eyes * 0.3 + 0.7})`;
            
            document.getElementById('lipstickLayer').style.opacity = appEngineState.sliders.lipstick.intensity.val / 100;
            document.getElementById('blushLayer').style.opacity = appEngineState.sliders.blush.intensity.val / 100;
            document.getElementById('eyeshadowLayer').style.opacity = appEngineState.sliders.eyeshadow.intensity.val / 100;
        }

        function updateTextContentPayload(v) { document.getElementById('globalTextNode').innerText = v; }
        function updateTextFontFamily(f) { document.getElementById('globalTextNode').style.fontFamily = f; }
        function updateTextColorValue(c) { document.getElementById('globalTextNode').style.color = c; }

        function initializeTextDragger() {
            const node = document.getElementById('globalTextNode');
            let active = false, startX, startY, initX, initY;
            node.addEventListener('mousedown', e => {
                active = true; initX = node.offsetLeft; initY = node.offsetTop;
                startX = e.clientX; startY = e.clientY;
            });
            document.addEventListener('mousemove', e => {
                if (!active) return;
                node.style.left = (initX + (e.clientX - startX)) + 'px';
                node.style.top = (initY + (e.clientY - startY)) + 'px';
            });
            document.addEventListener('mouseup', () => active = false);
        }

        // Professional Inpainting & Eraser Subsystem Canvas
        let drawing = false, ctx, canvas;
        function initializeEraserSystem() {
            canvas = document.getElementById('maskCanvas');
            ctx = canvas.getContext('2d');
            canvas.addEventListener('mousedown', () => drawing = true);
            canvas.addEventListener('mouseup', () => { drawing = false; ctx.beginPath(); });
            canvas.addEventListener('mousemove', e => {
                if (!drawing || !appEngineState.eraserActive) return;
                const r = canvas.getBoundingClientRect();
                ctx.lineWidth = 20; ctx.lineCap = 'round'; ctx.strokeStyle = 'rgba(239,68,68,0.8)';
                ctx.lineTo(e.clientX - r.left, e.clientY - r.top); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(e.clientX - r.left, e.clientY - r.top);
            });
        }

        function toggleManualMagicEraser() {
            appEngineState.eraserActive = !appEngineState.eraserActive;
            const btn = document.getElementById('eraserBtn');
            const img = document.getElementById('targetImage');
            if(appEngineState.eraserActive) {
                btn.className = "w-full bg-amber-500 text-black p-3 rounded-xl text-xs font-bold";
                canvas.style.pointerEvents = 'auto';
                canvas.width = img.clientWidth; canvas.height = img.clientHeight;
            } else {
                btn.className = "w-full bg-slate-900 border border-slate-800 p-3 rounded-xl text-xs text-slate-300";
                canvas.style.pointerEvents = 'none';
                ctx.clearRect(0,0,canvas.width,canvas.height);
            }
        }

        async function triggerBackgroundRemovalAI() {
            const modal = document.getElementById('progressPercentageModal');
            const fill = document.getElementById('progressFillInner');
            const num = document.getElementById('numericPercentageDisplay');
            
            modal.classList.remove('hidden');
            let p = 0;
            const iv = setInterval(() => { p += 5; if(p>=95) p=95; num.innerText = p+"%"; fill.style.width = p+"%"; }, 100);

            try {
                const img = document.getElementById('targetImage');
                const res = await fetch('https://api.remove.bg/v1.0/removebg', {
                    method: 'POST',
                    headers: { 'X-API-Key': 'THDkgwTVmzeST6Po11GJsSoW' },
                    body: JSON.stringify({ image_url: img.src, size: 'auto' })
                });
                clearInterval(iv);
                if(res.ok) {
                    num.innerText = "100%"; fill.style.width = "100%";
                    const blob = await res.blob();
                    img.src = URL.createObjectURL(blob);
                } else { alert("API Limit Error yor Key!"); }
            } catch { clearInterval(iv); alert("Connection Error!"); }
            setTimeout(() => modal.classList.add('hidden'), 500);
        }

        function exportProcessedStudioPhoto() {
            const img = document.getElementById('targetImage');
            const link = document.createElement('a');
            link.download = 'KurdFaceStudio_Export.png';
            link.href = img.src;
            link.click();
        }

        function loadSampleModel(g) {
            document.getElementById('targetImage').src = (g==='female') ? "https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=800&auto=format&fit=crop" : "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?q=80&w=800&auto=format&fit=crop";
        }

        function loadUserPhoto(e) {
            const f = e.target.files[0];
            if(f) { const r = new FileReader(); r.onload = ev => document.getElementById('targetImage').src = ev.target.result; r.readAsDataURL(f); }
        }
    </script>
</body>
