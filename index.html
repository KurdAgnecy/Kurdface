<!DOCTYPE html>
<html lang="ku" dir="rtl" id="htmlRoot" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kurd Face Studio - Powered by Kurd Agency</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: {} } }
    </script>
    
    <link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@300;400;600;700&family=Cairo:wght@400;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cssgram/0.1.10/cssgram.min.css">
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/vision_bundle.js" crossorigin="anonymous"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/color-thief/2.3.0/color-thief.umd.js"></script>

    <style>
        body { font-family: 'Noto Kufi Arabic', sans-serif; user-select: none; overflow: hidden; height: 100vh; transition: background-color 0.3s, color 0.3s; }
        .dark body { background-color: #08090c; color: #f3f4f6; }
        html:not(.dark) body { background-color: #f1f5f9; color: #1e293b; }
        
        .workspace-grid { background-image: radial-gradient(rgba(100,116,139,0.2) 1px, transparent 1px); background-size: 20px 20px; }
        
        /* Sliders */
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 16px; width: 16px; border-radius: 50%; background: #f59e0b; cursor: pointer; margin-top: -6px; }
        .dark input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; background: #1e293b; border-radius: 2px; }
        html:not(.dark) input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; background: #cbd5e1; border-radius: 2px; }
        .no-scrollbar::-webkit-scrollbar { display: none; }

        /* Layers Setup */
        #editorContainer { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        #mainImage { max-width: 100%; max-height: 100%; object-fit: contain; transition: filter 0.2s; display: none; }
        
        /* We stack canvases: Image -> Mediapipe Makeup -> FabricJS (Text/Watermark) */
        .canvas-layer { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); pointer-events: none; }
        #fabricCanvasContainer { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); pointer-events: auto; }
        
        /* Cropper container */
        #cropperContainer { display: none; position: absolute; inset: 0; z-index: 100; background: rgba(0,0,0,0.8); padding: 20px;}
    </style>
</head>
<body class="flex flex-col">

    <header class="dark:bg-[#0f111a] bg-white border-b dark:border-slate-800 border-slate-200 px-6 py-3 flex justify-between items-center shrink-0 z-50 shadow-md transition-colors">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-amber-500 to-yellow-400 flex items-center justify-center font-bold text-black text-xl shadow-lg">KF</div>
            <div>
                <h1 class="text-md font-bold tracking-wide" id="txt-title">Kurd Face Studio</h1>
                <p class="text-[10px] text-amber-600 font-bold" id="txt-author">دروستکراوە لە لایەن ئاریان علی : کورد ئەجێنسی</p>
            </div>
        </div>
        
        <div class="flex items-center gap-2">
            <select id="langSelector" onchange="changeLanguage(this.value)" class="bg-slate-200 dark:bg-slate-800 text-xs p-2 rounded-lg outline-none font-bold cursor-pointer">
                <option value="ku">کوردی</option>
                <option value="en">English</option>
                <option value="ar">العربية</option>
            </select>

            <button onclick="toggleTheme()" class="p-2 rounded-lg bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 transition" title="Light/Dark Mode">
                <span id="themeIcon">☀️</span>
            </button>

            <div class="flex bg-slate-200 dark:bg-slate-800 rounded-lg overflow-hidden ml-2 border dark:border-slate-700 border-slate-300">
                <button onclick="performUndo()" class="px-3 py-2 hover:bg-slate-300 dark:hover:bg-slate-700 transition text-xs font-bold" title="Undo">↩️</button>
                <button onclick="performRedo()" class="px-3 py-2 border-l dark:border-slate-700 border-slate-300 hover:bg-slate-300 dark:hover:bg-slate-700 transition text-xs font-bold" title="Redo">↪️</button>
            </div>

            <button onclick="exportFinalImage()" class="ml-2 bg-emerald-500 hover:bg-emerald-600 text-white text-xs font-bold px-4 py-2.5 rounded-lg transition flex items-center gap-2 shadow-md">
                <span id="txt-save">سەیڤکردن 💾</span>
            </button>

            <label class="bg-amber-500 hover:bg-amber-600 text-black text-xs font-bold px-4 py-2.5 rounded-lg cursor-pointer transition flex items-center gap-2 shadow-md">
                <span id="txt-upload">بارکردنی وێنە 📁</span>
                <input type="file" id="imageUploader" accept="image/*" class="hidden" onchange="handleImageUpload(event)">
            </label>
        </div>
    </header>

    <main class="flex-1 flex flex-col lg:flex-row overflow-hidden">
        
        <div class="flex-1 workspace-grid dark:bg-[#050608] bg-slate-50 flex items-center justify-center p-6 relative overflow-hidden h-full">
            
            <div id="editorContainer" class="relative max-w-full max-h-full rounded-2xl shadow-2xl overflow-hidden flex items-center justify-center dark:bg-[#090b11] bg-white border dark:border-slate-800 border-slate-300">
                
                <img id="mainImage" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=800&auto=format&fit=crop" crossorigin="anonymous">
                <canvas id="baseRenderCanvas" class="canvas-layer"></canvas>
                
                <canvas id="makeupCanvas" class="canvas-layer z-20"></canvas>
                
                <div id="fabricCanvasContainer" class="z-30">
                    <canvas id="fabricCanvas"></canvas>
                </div>

                <canvas id="eraserCanvas" class="canvas-layer z-40 hidden" style="pointer-events: auto;"></canvas>

            </div>

            <div id="cropperContainer">
                <img id="cropperImage" src="">
                <div class="absolute bottom-5 left-1/2 transform -translate-x-1/2 flex gap-4">
                    <button onclick="applyCrop()" class="bg-emerald-500 text-white px-6 py-2 rounded-xl font-bold">بڕین (Crop)</button>
                    <button onclick="cancelCrop()" class="bg-red-500 text-white px-6 py-2 rounded-xl font-bold">پاشگەزبوونەوە</button>
                </div>
            </div>

            <div id="paletteOverlay" class="absolute bottom-4 left-4 flex gap-1 z-50 hidden p-2 bg-black/50 rounded-lg backdrop-blur-md"></div>
        </div>

        <div class="w-full lg:w-[400px] dark:bg-[#0c0d14] bg-white border-t lg:border-t-0 lg:border-r dark:border-slate-800 border-slate-200 flex flex-col shrink-0 shadow-2xl transition-colors z-40">
            
            <div class="flex overflow-x-auto dark:bg-[#0f111a] bg-slate-100 border-b dark:border-slate-800 border-slate-300 p-2 gap-1 no-scrollbar shrink-0">
                <button onclick="switchTab('makeup', this)" class="tab-btn bg-amber-500 text-black px-3 py-2 rounded-lg text-xs font-bold shrink-0">💄 مەیک ئەپ</button>
                <button onclick="switchTab('filters', this)" class="tab-btn dark:text-slate-400 text-slate-600 px-3 py-2 rounded-lg text-xs font-semibold shrink-0">🎬 فلتەر (CSSgram)</button>
                <button onclick="switchTab('tools', this)" class="tab-btn dark:text-slate-400 text-slate-600 px-3 py-2 rounded-lg text-xs font-semibold shrink-0">✂️ ئامرازەکان</button>
                <button onclick="switchTab('text', this)" class="tab-btn dark:text-slate-400 text-slate-600 px-3 py-2 rounded-lg text-xs font-semibold shrink-0">📝 تێکست و لۆگۆ</button>
            </div>

            <div id="propertiesPanel" class="flex-1 overflow-y-auto p-4 space-y-5 no-scrollbar">
                </div>
            
        </div>
    </main>

    <script>
        // --- 1. Global State & Dictionaries ---
        const state = {
            currentTab: 'makeup',
            lang: 'ku',
            theme: 'dark',
            faceLandmarks: null,
            history: [],
            historyIndex: -1,
            isEraserActive: false,
            sliders: { lipstickOpacity: 0, lipstickColor: '#dc2626', blur: 0 }
        };

        const dict = {
            ku: { title: "Kurd Face Studio", author: "دروستکراوە لە لایەن ئاریان علی : کورد ئەجێنسی", save: "سەیڤکردن 💾", upload: "بارکردنی وێنە 📁", crop: "بڕینی وێنە", palette: "دەرهێنانی ڕەنگەکان", eraser: "سڕینەوەی دەستی", removeBg: "لابردنی باکگراوند (API)" },
            en: { title: "Kurd Face Studio", author: "Created by Aryan Ali : Kurd Agency", save: "Export 💾", upload: "Upload 📁", crop: "Crop Image", palette: "Extract Palette", eraser: "Magic Eraser", removeBg: "Remove BG (API)" },
            ar: { title: "استوديو كورد فيس", author: "تم الإنشاء بواسطة أريان علي : وكالة كورد", save: "حفظ 💾", upload: "رفع صورة 📁", crop: "قص الصورة", palette: "استخراج الألوان", eraser: "ممحاة", removeBg: "إزالة الخلفية (API)" }
        };

        // UI instances
        let fabricCanvasInstance;
        let cropperInstance;
        let faceLandmarker;

        // --- 2. Initialization & Core Systems ---
        document.addEventListener('DOMContentLoaded', async () => {
            initFabricJS();
            await initMediapipe();
            updateUI();
            saveStateToHistory(); // Initial state
            
            const img = document.getElementById('mainImage');
            img.onload = () => { processNewImage(); };
            if(img.complete) processNewImage();
        });

        function changeLanguage(l) {
            state.lang = l;
            document.getElementById('txt-title').innerText = dict[l].title;
            document.getElementById('txt-author').innerText = dict[l].author;
            document.getElementById('txt-save').innerText = dict[l].save;
            document.getElementById('txt-upload').innerText = dict[l].upload;
            updateUI();
        }

        function toggleTheme() {
            document.getElementById('htmlRoot').classList.toggle('dark');
            document.getElementById('themeIcon').innerText = document.getElementById('htmlRoot').classList.contains('dark') ? "☀️" : "🌙";
        }

        // --- 3. Fabric.js Setup (Text, Watermark, Layers) ---
        function initFabricJS() {
            fabricCanvasInstance = new fabric.Canvas('fabricCanvas', { preserveObjectStacking: true });
            // Handle resizing gracefully
            fabricCanvasInstance.on('object:modified', saveStateToHistory);
        }

        // --- 4. Google Mediapipe Setup (Real Face Landmarks) ---
        async function initMediapipe() {
            try {
                const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm");
                faceLandmarker = await FaceLandmarker.createFromOptions(vision, {
                    baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task", delegate: "GPU" },
                    runningMode: "IMAGE",
                    numFaces: 1
                });
                console.log("Mediapipe Ready ✅");
            } catch (err) {
                console.error("Mediapipe loading error:", err);
            }
        }

        async function detectFaceAndDrawMakeup() {
            if (!faceLandmarker) return;
            const img = document.getElementById('mainImage');
            const makeupCanvas = document.getElementById('makeupCanvas');
            
            // Sync canvas sizes
            makeupCanvas.width = img.clientWidth;
            makeupCanvas.height = img.clientHeight;

            try {
                const results = faceLandmarker.detect(img);
                if (results.faceLandmarks && results.faceLandmarks.length > 0) {
                    state.faceLandmarks = results.faceLandmarks[0];
                    drawMakeupLayer();
                } else {
                    state.faceLandmarks = null;
                    makeupCanvas.getContext('2d').clearRect(0, 0, makeupCanvas.width, makeupCanvas.height);
                }
            } catch (e) { console.error("Detection failed", e); }
        }

        function drawMakeupLayer() {
            const canvas = document.getElementById('makeupCanvas');
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (!state.faceLandmarks || state.sliders.lipstickOpacity <= 0) return;

            // Mediapipe Lips Indices (Outer and Inner mapping)
            const LIP_OUTER = [61, 185, 40, 39, 37, 0, 267, 269, 270, 409, 291, 375, 321, 405, 314, 17, 84, 181, 91, 146];
            
            ctx.beginPath();
            LIP_OUTER.forEach((idx, i) => {
                const pt = state.faceLandmarks[idx];
                const x = pt.x * canvas.width;
                const y = pt.y * canvas.height;
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            });
            ctx.closePath();

            // Blend Mode for realistic makeup integration
            ctx.globalCompositeOperation = "multiply"; 
            ctx.fillStyle = state.sliders.lipstickColor;
            ctx.globalAlpha = state.sliders.lipstickOpacity / 100;
            ctx.fill();
        }

        // --- 5. Image Processing Pipeline ---
        function handleImageUpload(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (evt) => {
                const img = document.getElementById('mainImage');
                img.src = evt.target.result;
            };
            reader.readAsDataURL(file);
        }

        function processNewImage() {
            const img = document.getElementById('mainImage');
            const baseCanvas = document.getElementById('baseRenderCanvas');
            const fabricContainer = document.getElementById('fabricCanvasContainer');
            const makeupCanvas = document.getElementById('makeupCanvas');
            
            // Set dimensions to match displayed image bounds
            const w = img.clientWidth;
            const h = img.clientHeight;
            
            baseCanvas.width = w; baseCanvas.height = h;
            makeupCanvas.width = w; makeupCanvas.height = h;
            
            const ctx = baseCanvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            
            // Resize FabricJS
            fabricContainer.style.width = w + 'px';
            fabricContainer.style.height = h + 'px';
            fabricCanvasInstance.setWidth(w);
            fabricCanvasInstance.setHeight(h);
            fabricCanvasInstance.clear(); // clear old text on new image

            detectFaceAndDrawMakeup();
            saveStateToHistory();
        }

        // --- 6. Tool Actions (Cropper, Palette, AI) ---
        function startCropper() {
            const cropBox = document.getElementById('cropperContainer');
            const crpImg = document.getElementById('cropperImage');
            const mainImg = document.getElementById('mainImage');
            
            cropBox.style.display = 'block';
            crpImg.src = mainImg.src;
            
            if(cropperInstance) cropperInstance.destroy();
            cropperInstance = new Cropper(crpImg, { viewMode: 1, autoCropArea: 0.8 });
        }

        function applyCrop() {
            if(!cropperInstance) return;
            const croppedData = cropperInstance.getCroppedCanvas().toDataURL('image/png');
            document.getElementById('mainImage').src = croppedData;
            cancelCrop();
        }

        function cancelCrop() {
            document.getElementById('cropperContainer').style.display = 'none';
            if(cropperInstance) cropperInstance.destroy();
        }

        function extractColorPalette() {
            const img = document.getElementById('mainImage');
            const colorThief = new ColorThief();
            if (img.complete) {
                try {
                    const palette = colorThief.getPalette(img, 5);
                    const overlay = document.getElementById('paletteOverlay');
                    overlay.innerHTML = palette.map(p => `<div style="width:24px;height:24px;border-radius:4px;background:rgb(${p[0]},${p[1]},${p[2]})"></div>`).join('');
                    overlay.classList.remove('hidden');
                    setTimeout(() => overlay.classList.add('hidden'), 5000);
                } catch(e) { alert("کێشە لە دەرهێنانی ڕەنگەکان (CORS)"); }
            }
        }

        function addFabricText() {
            const text = new fabric.IText('کورد فەیس', {
                left: fabricCanvasInstance.width / 2,
                top: fabricCanvasInstance.height / 2,
                fontFamily: 'Noto Kufi Arabic',
                fill: '#ffffff',
                fontSize: 40,
                originX: 'center', originY: 'center',
                shadow: new fabric.Shadow({ color: 'rgba(0,0,0,0.5)', blur: 5 })
            });
            fabricCanvasInstance.add(text);
            fabricCanvasInstance.setActiveObject(text);
            saveStateToHistory();
        }

        // --- 7. History System (Undo / Redo) ---
        // For efficiency, we save the composite DataURL
        function saveStateToHistory() {
            setTimeout(() => {
                const data = generateCompositeSnapshot();
                if(state.historyIndex < state.history.length - 1) {
                    state.history = state.history.slice(0, state.historyIndex + 1);
                }
                state.history.push(data);
                if(state.history.length > 15) state.history.shift(); // Keep last 15
                state.historyIndex = state.history.length - 1;
            }, 100);
        }

        function performUndo() {
            if(state.historyIndex > 0) {
                state.historyIndex--;
                restoreSnapshot(state.history[state.historyIndex]);
            }
        }

        function performRedo() {
            if(state.historyIndex < state.history.length - 1) {
                state.historyIndex++;
                restoreSnapshot(state.history[state.historyIndex]);
            }
        }

        function restoreSnapshot(dataUrl) {
            const img = document.getElementById('mainImage');
            img.src = dataUrl;
            // Clear overlays because snapshot has them baked in (for simplicity in this combo architecture)
            fabricCanvasInstance.clear();
            state.sliders.lipstickOpacity = 0;
            updateUI();
        }

        function generateCompositeSnapshot() {
            const exportCanvas = document.createElement('canvas');
            const mainImg = document.getElementById('mainImage');
            exportCanvas.width = mainImg.clientWidth;
            exportCanvas.height = mainImg.clientHeight;
            const ctx = exportCanvas.getContext('2d');

            // 1. Base Image with CSS filter applied
            ctx.filter = mainImg.style.filter;
            ctx.drawImage(mainImg, 0, 0, exportCanvas.width, exportCanvas.height);
            ctx.filter = 'none';

            // 2. Makeup Layer
            ctx.drawImage(document.getElementById('makeupCanvas'), 0, 0);

            // 3. Fabric Layer
            ctx.drawImage(document.getElementById('fabricCanvas'), 0, 0);

            return exportCanvas.toDataURL('image/png');
        }

        function exportFinalImage() {
            const dataUrl = generateCompositeSnapshot();
            const link = document.createElement('a');
            link.download = `KurdFace_Export_${Date.now()}.png`;
            link.href = dataUrl;
            link.click();
        }

        // --- 8. UI Interactions ---
        function switchTab(tab, element) {
            state.currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(b => {
                b.className = "tab-btn dark:text-slate-400 text-slate-600 px-3 py-2 rounded-lg text-xs font-semibold shrink-0 transition hover:bg-slate-200 dark:hover:bg-slate-800";
            });
            element.className = "tab-btn bg-amber-500 text-black px-3 py-2 rounded-lg text-xs font-bold shrink-0 transition shadow-md";
            updateUI();
        }

        function applyCssFilter(filterClass) {
            const canvasContainer = document.getElementById('baseRenderCanvas');
            canvasContainer.className = `canvas-layer ${filterClass}`;
            saveStateToHistory();
        }

        function applyBlur(val) {
            state.sliders.blur = val;
            document.getElementById('mainImage').style.filter = `blur(${val}px)`;
        }

        function updateLipstick(val, type) {
            if(type === 'opacity') state.sliders.lipstickOpacity = val;
            if(type === 'color') state.sliders.lipstickColor = val;
            drawMakeupLayer();
        }

        function updateUI() {
            const panel = document.getElementById('propertiesPanel');
            panel.innerHTML = '';
            const t = state.currentTab;

            if (t === 'makeup') {
                panel.innerHTML = `
                    <div class="space-y-4">
                        <div class="bg-amber-500/10 p-3 rounded-xl border border-amber-500/20">
                            <h3 class="text-xs font-bold text-amber-500 mb-2">ئۆتۆماتیک بە Mediapipe AI 🤖</h3>
                            <p class="text-[10px] dark:text-slate-400 mb-3">هۆشی دەستکرد بە شێوەیەکی زیرەک خاڵەکانی لێو دەدۆزێتەوە و ڕەنگەکەی دەخاتە سەر.</p>
                            
                            <label class="text-xs font-semibold block mb-2 dark:text-white">تۆخی سووراو (Opacity)</label>
                            <input type="range" min="0" max="100" value="${state.sliders.lipstickOpacity}" oninput="updateLipstick(this.value, 'opacity')" onchange="saveStateToHistory()">
                            
                            <label class="text-xs font-semibold block mt-3 mb-2 dark:text-white">ڕەنگی سووراو</label>
                            <div class="grid grid-cols-6 gap-2">
                                ${['#dc2626','#be185d','#9333ea','#b91c1c','#ea580c','#000000'].map(c => `
                                    <button onclick="updateLipstick('${c}', 'color'); saveStateToHistory()" class="w-8 h-8 rounded-full border-2 border-transparent hover:border-amber-500 transition" style="background-color: ${c}"></button>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                `;
            } else if (t === 'filters') {
                const filters = [
                    { name: 'Normal', cls: '' }, { name: '1977', cls: '_1977' }, { name: 'Aden', cls: 'aden' },
                    { name: 'Brannan', cls: 'brannan' }, { name: 'Brooklyn', cls: 'brooklyn' }, { name: 'Clarendon', cls: 'clarendon' },
                    { name: 'Earlybird', cls: 'earlybird' }, { name: 'Gingham', cls: 'gingham' }, { name: 'Hudson', cls: 'hudson' }
                ];
                panel.innerHTML = `
                    <div class="grid grid-cols-2 gap-3">
                        ${filters.map(f => `
                            <button onclick="applyCssFilter('${f.cls}')" class="p-3 bg-slate-100 dark:bg-slate-900 border border-slate-300 dark:border-slate-800 rounded-xl text-xs font-semibold hover:border-amber-500 transition shadow-sm">
                                ${f.name}
                            </button>
                        `).join('')}
                    </div>
                `;
            } else if (t === 'tools') {
                panel.innerHTML = `
                    <div class="space-y-3">
                        <button onclick="startCropper()" class="w-full p-3 bg-slate-100 dark:bg-slate-900 border border-slate-300 dark:border-slate-800 rounded-xl flex items-center gap-2 text-xs font-bold hover:border-amber-500 transition">
                            ✂️ ${dict[state.lang].crop} (Cropper.js)
                        </button>
                        <button onclick="extractColorPalette()" class="w-full p-3 bg-slate-100 dark:bg-slate-900 border border-slate-300 dark:border-slate-800 rounded-xl flex items-center gap-2 text-xs font-bold hover:border-amber-500 transition">
                            🎨 ${dict[state.lang].palette}
                        </button>
                        <div class="p-3 bg-slate-100 dark:bg-slate-900 border border-slate-300 dark:border-slate-800 rounded-xl">
                            <label class="text-xs font-bold block mb-2">💧 لێڵکردن (Blur / Tilt-Shift)</label>
                            <input type="range" min="0" max="20" value="${state.sliders.blur}" oninput="applyBlur(this.value)" onchange="saveStateToHistory()">
                        </div>
                    </div>
                `;
            } else if (t === 'text') {
                panel.innerHTML = `
                    <div class="space-y-3">
                        <div class="bg-blue-500/10 border border-blue-500/20 p-3 rounded-xl mb-4">
                            <p class="text-[10px] text-blue-400 font-medium">ئەم بەشە بە تەکنەلۆژیای Fabric.js کار دەکات بۆ کۆنترۆڵکردنی پڕۆفێشناڵی تێکست.</p>
                        </div>
                        <button onclick="addFabricText()" class="w-full bg-amber-500 text-black font-bold p-3 rounded-xl shadow-md transition hover:scale-[1.02]">
                            ➕ زیادکردنی تێکست
                        </button>
                        <button onclick="if(fabricCanvasInstance.getActiveObject()) { fabricCanvasInstance.remove(fabricCanvasInstance.getActiveObject()); saveStateToHistory(); }" class="w-full bg-red-500/20 text-red-500 font-bold p-3 rounded-xl transition hover:bg-red-500/30 border border-red-500/30">
                            🗑️ سڕینەوەی تێکستی دیاریکراو
                        </button>
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
